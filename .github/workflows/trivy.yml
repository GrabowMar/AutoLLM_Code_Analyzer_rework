name: Trivy

on:
  workflow_dispatch:
  pull_request:
    branches: ['main']
    paths:
      - '.github/workflows/trivy.yml'
      - '.github/trivy.yaml'
      - 'compose/**'
      - 'docker-compose.local.yml'
      - 'docker-compose.production.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
  push:
    branches: ['main']
    paths:
      - '.github/workflows/trivy.yml'
      - '.github/trivy.yaml'
      - 'compose/**'
      - 'docker-compose.local.yml'
      - 'docker-compose.production.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
  schedule:
    - cron: '42 4 * * 3'

permissions:
  contents: read
  security-events: write

jobs:
  fs-scan:
    name: Filesystem scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          trivy-config: .github/trivy.yaml
          format: sarif
          output: trivy-fs.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-fs.sarif') != ''
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  image-scan:
    name: Image scan (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [django, nginx]
    steps:
      - uses: actions/checkout@v7

      - name: Seed production env files from examples
        run: |
          shopt -s dotglob
          for f in .envs/.production/*.example; do
            cp -n "$f" "${f%.example}"
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/bake-action@v7
        with:
          push: false
          load: true
          files: docker-compose.production.yml
          targets: ${{ matrix.target }}

      - name: Discover image tag
        id: img
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          tag=$(docker buildx bake --file docker-compose.production.yml --print "$TARGET" |
            jq -er --arg target "$TARGET" '
              .target[$target].tags |
              if type == "array" and length == 1 and (.[0] | type == "string" and length > 0)
              then .[0] else error("Expected exactly one image tag for " + $target) end')
          docker image inspect "$tag" --format '{{.Id}}'
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.img.outputs.tag }}
          trivy-config: .github/trivy.yaml
          format: sarif
          output: trivy-${{ matrix.target }}.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Upload SARIF
        if: always() && hashFiles(format('trivy-{0}.sarif', matrix.target)) != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-${{ matrix.target }}.sarif
          category: trivy-${{ matrix.target }}
