# Containers show up as llmlab-<service>-1, volumes as llmlab_<volume>.
name: llmlab

# Every service runs under a memory/CPU/PID cap and with a raised OOM score, so
# a busy dev stack slows itself down (or is the first thing the kernel's OOM
# killer picks) instead of starving whatever else shares the host.
volumes:
  postgres_data: {}
  postgres_data_backups: {}
  redis_data: {}
  apps_dind_data: {}
  apps_dind_certs: {}
  # depcache (WP-05): storage of the pull-through caches; mounted by the cache services only, never by agents.
  depcache_npm: {}
  depcache_pypi: {}
  depcache_go: {}
  depcache_maven: {}

networks:
  default: {}
  # Internal-only network between the executor's LLM proxy (LLM_PROXY_ADDR,
  # 172.30.99.2:8090) and apps-dind (APPS_DIND_LLMPROXY_ADDR, 172.30.99.3), so
  # gateways of local-model agent runs can
  # reach the proxy (spec §B.6). No default route, no other members.
  llmproxy:
    internal: true
    ipam:
      config:
        - subnet: "${LLMPROXY_SUBNET:-172.30.99.0/29}"
  # depcache (WP-05): internal network between the read-only dependency caches and apps-dind, whose
  # sandbox gateways forward agents' package requests to them (docs/STACKS.md). No default route.
  depcache:
    internal: true
    ipam:
      config:
        - subnet: "${DEPCACHE_SUBNET:-172.30.98.0/28}"

services:
  django: &django
    build:
      context: .
      dockerfile: ./compose/local/django/Dockerfile
    # One image for django, celery and flower (same Dockerfile).
    image: llmlab/django:local
    depends_on:
      - postgres
      - redis
      - mailpit
      - apps-dind
    volumes:
      - /app/.venv
      - .:/app:z
      # Client half of the apps-dind TLS material only (not its CA key).
      - type: volume
        source: apps_dind_certs
        target: /apps-dind-certs
        read_only: true
        volume:
          subpath: client
    env_file:
      - ./.envs/.local/.django
      - ./.envs/.local/.postgres
    environment: &django-env
      # Sample apps are built and run inside apps-dind (nested containers), and
      # the reverse-proxy reaches an app's published port at apps-dind:<app_port>.
      APPS_DOCKER_HOST: tcp://apps-dind:2376
      APPS_DOCKER_CERT_PATH: /apps-dind-certs
      APPS_UPSTREAM_HOST: apps-dind
      # App ports are published inside apps-dind only, so browsers reach apps via
      # Django's /apps/<name>/ path proxy (or APPS_SUBDOMAIN_PROXY, which wins).
      APPS_PROXY_PATH: "True"
      # Authoritative apps-dind memory for the executor's memory rule; keep it
      # equal to apps-dind's mem_limit below.
      APPS_DIND_MEM_LIMIT: "${APPS_DIND_MEM_LIMIT:-4g}"
      # Frontend + Caddy addresses: the relay's client IP is the right-most
      # X-Forwarded-For hop outside these CIDRs.
      TRUSTED_PROXY_CIDRS: "${TRUSTED_PROXY_CIDRS:-}"
    ports:
      - '8001:8000'
    command: /start
    # Also hosts the devcontainer session (editor server, tests).
    mem_limit: 4g
    cpus: 4
    pids_limit: 2048
    oom_score_adj: 500

  # Runs every generation job (scheduling, sandboxes, LLM calls, evaluation,
  # the internal LLM proxy, schedules and post-runs); the web process only
  # writes rows. One instance, no autoreload: restart it to pick up backend
  # code (drain first, see docs/EXECUTION.md).
  executor:
    <<: *django
    depends_on:
      - postgres
      - redis
      - apps-dind
    ports: []
    # Run from the bind-mounted repo (not the image's /start-executor copy) so a
    # stale llmlab/django:local image still starts it; no rebuild needed.
    command: ["bash", "/app/compose/local/django/start-executor"]
    # The executor exits 1 when it loses the leader lock (Postgres restart,
    # dropped lock connection), when its LLM proxy cannot bind, or when
    # migrations are still pending after 10 min; Docker brings it back.
    restart: unless-stopped
    networks:
      default: {}
      llmproxy:
        ipv4_address: "${LLM_PROXY_ADDR:-172.30.99.2}"
    environment:
      <<: *django-env
      CONN_MAX_AGE: "0"
      APPS_DIND_MEM_LIMIT: "${APPS_DIND_MEM_LIMIT:-4g}"
      # Keep the proxy's bind address, the gateways' upstream and the nested
      # egress subnet in step with the network overrides above / on apps-dind.
      LLM_PROXY_BIND: "${LLM_PROXY_ADDR:-172.30.99.2}:8090"
      LLM_PROXY_UPSTREAM: "http://${LLM_PROXY_ADDR:-172.30.99.2}:8090/v1"
      LLM_GATEWAY_EGRESS_SUBNET: "${LLM_GATEWAY_EGRESS_SUBNET:-10.213.0.0/24}"
    # No extra_hosts: direct endpoints (tailnet/VPN) are reached through host
    # routing + masquerade; host.docker.internal would expose every host-bound
    # service and is rejected by the SSRF validator anyway.
    stop_grace_period: 30s
    mem_limit: 2g
    cpus: 2
    pids_limit: 1024
    oom_score_adj: 500

  postgres:
    build:
      context: .
      dockerfile: ./compose/production/postgres/Dockerfile
    image: llmlab/postgres:local
    volumes:
      - postgres_data:/var/lib/postgresql
      - postgres_data_backups:/backups
    env_file:
      - ./.envs/.local/.postgres
    mem_limit: 1g
    cpus: 2
    pids_limit: 512
    oom_score_adj: 500

  # Sandbox Docker daemon: generated apps and analyzer workspaces run as its
  # nested containers, off the host daemon and fenced off from this network.
  # Its limits cap all of them together.
  apps-dind:
    build:
      context: .
      dockerfile: ./compose/local/apps-dind/Dockerfile
    image: llmlab/apps-dind:local
    privileged: true
    hostname: apps-dind
    environment:
      DOCKER_TLS_CERTDIR: /certs
      DOCKER_TLS_SAN: DNS:apps-dind
      # Firewall exception for local-model gateways -> executor LLM proxy
      # (compose/local/apps-dind/entrypoint.sh).
      LLM_PROXY_ADDR: "${LLM_PROXY_ADDR:-172.30.99.2}"
      LLM_PROXY_PORT: "8090"
      LLM_GATEWAY_EGRESS_SUBNET: "${LLM_GATEWAY_EGRESS_SUBNET:-10.213.0.0/24}"
      LLMPROXY_SUBNET: "${LLMPROXY_SUBNET:-172.30.99.0/29}"
      APPS_DIND_LLMPROXY_ADDR: "${APPS_DIND_LLMPROXY_ADDR:-172.30.99.3}"
    volumes:
      - apps_dind_data:/var/lib/docker
      - apps_dind_certs:/certs
    networks:
      default: {}
      llmproxy:
        # Override together with LLMPROXY_SUBNET / LLM_PROXY_ADDR (same subnet).
        ipv4_address: "${APPS_DIND_LLMPROXY_ADDR:-172.30.99.3}"
    # Keep APPS_DIND_MEM_LIMIT equal to this cap (django/executor read it).
    mem_limit: ${APPS_DIND_MEM_LIMIT:-4g}
    cpus: ${APPS_DIND_CPUS:-4}
    pids_limit: 4096
    oom_score_adj: 500

  # --- WP-05 depcache --- read-only pull-through dependency caches (spec 4.2; docs/STACKS.md).
  # Opt-in: `docker compose --profile depcache up -d`. Each cache is on `default` (upstream registries) and on
  # the internal `depcache` network at a fixed address; the backend reads DEPCACHE_*_URL (unset = the
  # public registries, note depcache_unavailable). Nothing can be published to any of them, and their
  # volumes are never mounted into an agent container.
  depcache-npm:
    image: docker.io/verdaccio/verdaccio:7.0.2@sha256:5623458a61100ff2c89526752e8ea2db58ae2d494fa202c18bf4a508ec46892c
    profiles: [depcache]
    restart: unless-stopped
    volumes:
      - ./compose/local/depcache/verdaccio/config.yaml:/verdaccio/conf/config.yaml:ro
      - depcache_npm:/verdaccio/storage
    networks:
      default: {}
      depcache:
        ipv4_address: "${DEPCACHE_NPM_ADDR:-172.30.98.2}"
    mem_limit: 512m
    cpus: 1
    pids_limit: 256
    oom_score_adj: 500

  depcache-pypi:
    build:
      context: ./compose/local/depcache/devpi
    image: llmlab/depcache-pypi:local
    profiles: [depcache]
    restart: unless-stopped
    volumes:
      - depcache_pypi:/devpi/server
    networks:
      default: {}
      depcache:
        ipv4_address: "${DEPCACHE_PYPI_ADDR:-172.30.98.3}"
    mem_limit: 512m
    cpus: 1
    pids_limit: 256
    oom_score_adj: 500

  depcache-go:
    image: docker.io/gomods/athens:v0.20.0@sha256:3620ce7230c723bdeac51f112541a659bf44923416b02f69cabf981fd9c0324a
    profiles: [depcache]
    restart: unless-stopped
    environment:
      ATHENS_STORAGE_TYPE: disk
      ATHENS_DISK_STORAGE_ROOT: /var/lib/athens
      ATHENS_DOWNLOAD_MODE: sync
      ATHENS_GO_BINARY_ENV_VARS: "GOPROXY=https://proxy.golang.org,direct"
    volumes:
      - depcache_go:/var/lib/athens
    networks:
      default: {}
      depcache:
        ipv4_address: "${DEPCACHE_GO_ADDR:-172.30.98.4}"
    mem_limit: 512m
    cpus: 1
    pids_limit: 512
    oom_score_adj: 500

  depcache-maven:
    image: docker.io/dzikoysk/reposilite:3.6.6@sha256:2438ab2a01392ea53d62ba83cdca1afe963603518f4282af4712076d39e1dd22
    profiles: [depcache]
    restart: unless-stopped
    environment:
      REPOSILITE_OPTS: "--shared-configuration=/app/configuration.shared.json"
    volumes:
      - ./compose/local/depcache/reposilite/configuration.shared.json:/app/configuration.shared.json:ro
      - depcache_maven:/app/data
    networks:
      default: {}
      depcache:
        ipv4_address: "${DEPCACHE_MAVEN_ADDR:-172.30.98.5}"
    mem_limit: 512m
    cpus: 1
    pids_limit: 256
    oom_score_adj: 500
  # --- end WP-05 depcache ---

  mailpit:
    image: docker.io/axllent/mailpit:latest
    ports:
      - "8025:8025"
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 128
    oom_score_adj: 500

  redis:
    image: docker.io/redis:8.8
    volumes:
      - redis_data:/data
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    oom_score_adj: 500

  celeryworker:
    <<: *django
    depends_on:
      - redis
      - postgres
      - mailpit
      - apps-dind
    ports: []
    command: /start-celeryworker
    environment:
      <<: *django-env
      # Prefork defaults to the host's CPU count (12 children, ~1.1 GB idle);
      # 2 is plenty for the remaining users / model-sync / integrations tasks and fits 1g
      # (the legacy automation tasks are still registered but nothing enqueues them).
      CELERY_WORKER_CONCURRENCY: "2"
    # Was 2g; job execution and automation moved to the executor.
    mem_limit: 1g
    cpus: 2

  celerybeat:
    <<: *django
    depends_on:
      - redis
      - postgres
      - mailpit
      - apps-dind
    ports: []
    command: /start-celerybeat
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128

  flower:
    <<: *django
    ports:
      - '5555:5555'
    command: /start-flower
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128

  frontend:
    build:
      context: .
      dockerfile: ./compose/local/frontend/Dockerfile
    image: llmlab/frontend:local
    restart: unless-stopped
    depends_on:
      - django
    volumes:
      - ./frontend:/app/frontend:z
      - /app/frontend/node_modules
    environment:
      - API_TARGET=http://django:8000
      - ORIGIN=${FRONTEND_ORIGIN:-http://localhost:8000}
      - PORT=8080
      - HOST=0.0.0.0
      - NODE_ENV=development
    ports:
      - '8000:8080'
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "8080"]
    mem_limit: 2g
    cpus: 2
    pids_limit: 1024
    oom_score_adj: 500
