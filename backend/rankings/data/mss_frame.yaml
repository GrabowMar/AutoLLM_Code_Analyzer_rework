# Curated inputs of the MSS v2 sampling frame (docs/design/MSS_V2.md).
#
# Read by backend/rankings/services/frame.py (canonicalisation and eligibility),
# pricing.py (first-party list prices) and selection.py (OpenCode Go limits).
# Every entry carries its source and the date it was checked. Nothing here is a
# score: it is identity, provenance and feasibility data.
#
# Sections
#   vendors       OpenRouter author slug -> models.dev first-party provider id,
#                 the vendor's own OpenRouter endpoint provider_name, and origin
#                 (US / CN / EU / CA / ...). Source: models.dev api.json provider
#                 ids and OpenRouter /api/v1/models/<id>/endpoints, 2026-11-09.
#   go_limits     OpenCode Go monthly usage limit (USD) per served model on the
#                 user's plan. Feasibility only (Amendment A1, B-go).
#   lines         line-key overrides for E7 (canonical id -> line key).
#   twins         local endpoint row -> canonical model, where the stored
#                 metadata.catalog_twin is missing (K5).
#   include       prerelease canonical ids admitted anyway, each with a reason.
#   exclude       canonical ids excluded, each with a reason.
#   open_weights  curated open/closed labels; they win over the member records.

