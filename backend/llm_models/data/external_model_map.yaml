# Curated mapping: our LLMModel.model_id -> exact model names in external sources.
#
# Used by `python manage.py import_external_covariates` (services/external_sources.py),
# which copies the matched rows into LLMModel.metadata["epoch"] / metadata["lmarena"].
#
# Sources (both CC-BY 4.0; attribution is stored with every imported value):
#   epoch    exact "Model" column of the Epoch AI "All AI models" CSV
#            (https://epoch.ai/data/all_ai_models.csv)
#   lmarena  exact "model_name" of the Hugging Face dataset lmarena-ai/leaderboard-dataset,
#            per dataset config: webdev (also used for webdev-html / webdev-react),
#            text (overall and coding categories), agent (agent arena, a different score scale)
#
# Rules
#   * Names are matched EXACTLY. Nothing is fuzzy-matched at import time; run the
#     command with --suggest to see candidates while curating this file.
#   * null = no matching entry in that source (or no confident match). The import then
#     removes a stale value; it never guesses.
#   * Reasoning effort matters. None of our runs sets an effort, so a run gets the
#     provider default (OpenRouter `reasoning.default_effort` for catalog models; unknown
#     for subscription endpoints). Arena entries are per effort ("(Max)", "(High)", ...):
#     we pick the entry labelled with the provider default when one exists, otherwise the
#     only entry for the model, and say so in `note`.
#   * match:
#       exact    same model and the default configuration we call
#       variant  same weights/version, but the external source measured a different
#                reasoning effort or release date than the one we call
#       assumed  identity is an assumption (subscription endpoint whose served model and
#                effort are not disclosed, or a disputed catalog link); read the note
#   * twin: for local endpoint rows, the OpenRouter catalog row assumed to serve the same
#     weights (models.dev "opencode-go" provider mapping unless the note says otherwise).
#     The covariates endpoint prefers metadata.catalog_twin when enrichment has set it.
#
# Curated 2026-11-02 against Epoch "All AI models" (last modified 2026-10-29) and the
# LMArena "latest" split published 2026-10-28.

