    epoch: DeepSeek V4.1 Flash
    lmarena:
      webdev: DeepSeek-V4.1-Flash-20260910 (Max)
      text: DeepSeek-V4.1-Flash-20260910 (Max)
      agent: DeepSeek-V4.1-Flash-20260910 (Max)
    match: variant
    note: >-
      OpenRouter canonical slug deepseek-v4.1-flash-20260910 matches the arena release date.
      Arena measured effort Max; our runs send no effort (OpenRouter default_effort 'high').
      No default-effort arena entry exists. The 20261017 update is a different arena row.

  z-ai/glm-5.3-flash:
    epoch: GLM-5.3-Flash
