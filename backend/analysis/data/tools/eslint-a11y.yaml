slug: eslint-a11y
name: ESLint JSX a11y
description: >-
  Static accessibility checks on JSX via eslint-plugin-jsx-a11y (recommended
  set): images without alt text, click handlers on non-interactive elements
  without keyboard support, form controls without labels, invalid ARIA
  roles and attributes, anchors that are not links.
category: lint
kind: container
target_language: javascript
analysis_mode: static
technologies: [javascript, react]
icon: badge-check
version: "6"
docs_url: https://github.com/jsx-eslint/eslint-plugin-jsx-a11y
install_cmd: "npm install -g eslint@8 eslint-plugin-jsx-a11y@6 @typescript-eslint/parser@7 @typescript-eslint/eslint-plugin@7 typescript@5"
verify_cmd: "eslint --version && npm ls -g eslint-plugin-jsx-a11y @typescript-eslint/parser >/dev/null"
uninstall_cmd: "npm uninstall -g eslint-plugin-jsx-a11y"
run_cmd: |
  g="$(npm root -g)"; printf '%s' '{"root":true,"env":{"browser":true,"node":true,"es2022":true},"parserOptions":{"ecmaVersion":"latest","sourceType":"module","ecmaFeatures":{"jsx":true}},"settings":{"react":{"version":"19.2"}},"plugins":["jsx-a11y"],"extends":["plugin:jsx-a11y/recommended"],"overrides":[{"files":["*.ts","*.tsx","*.mts","*.cts"],"parser":"PARSER"}]}' | sed "s#PARSER#$g/@typescript-eslint/parser/dist/index.js#" > /tmp/eslint-a11y.json
  eslint {target} --ext .js,.jsx,.cjs,.mjs,.ts,.tsx,.mts,.cts -f json --no-eslintrc -c /tmp/eslint-a11y.json --resolve-plugins-relative-to "$g" --ignore-pattern node_modules 2>/dev/null
parser_key: eslint
file_patterns: ["*.js", "*.jsx", "*.cjs", "*.mjs", "*.ts", "*.tsx", "*.mts", "*.cts"]
run_timeout: 120
install_timeout: 300
display_order: 36
sample_filename: App.jsx
sample_code: |
  export function Card({ onPick }) {
    return (
      <div onClick={onPick}>
        <img src="a.png" />
      </div>
    );
  }
