# jscpd: copy/paste (duplication) detector.
slug: jscpd
name: jscpd
kind: metrics
category: duplication
version: "4.3.0"
adapter_version: 2
languages: [python, javascript, jsx, typescript, tsx, vue, css, html]
file_kinds: [source]
output_kind: mixed
description: >-
  Copy/paste detector (Rabin-Karp over tokens). Reports each clone pair as a
  duplication finding and the share of duplicated lines, computed over the
  scanned files with every line counted once.
docs_url: https://github.com/kucherenko/jscpd
icon: copy
display_order: 120
mem_limit: 768m
timeout_s: 300
notes: >-
  Only the selected source files are passed (lockfiles, JSON and build output
  never are), with an explicit --config and a disjoint format/extension map so
  no file is counted twice; an app's .jscpd.json and .gitignore are ignored.
  "jscpd:ignore-start/end" markers are neutralized in staged copies when
  present.
config_schema:
  - name: min_tokens
    type: integer
    label: Minimum tokens
    description: Minimum clone size in tokens (--min-tokens).
    default: 50
    min: 10
    max: 1000
  - name: min_lines
    type: integer
    label: Minimum lines
    description: Minimum clone size in lines (--min-lines).
    default: 5
    min: 2
    max: 200
  - name: mode
    type: select
    label: Detection mode
    description: Token filtering mode (--mode); mild ignores whitespace and newlines, weak also comments.
    default: mild
    options:
      - {value: strict, label: Strict}
      - {value: mild, label: Mild}
      - {value: weak, label: Weak}
