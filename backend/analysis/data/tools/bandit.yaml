# Bandit: Python security linter (CWE ids reported natively).
slug: bandit
name: Bandit
kind: static
category: security
version: "1.9.4"
adapter_version: 2
languages: [python]
file_kinds: [source, config]
output_kind: findings
description: >-
  Security-oriented static analyzer for Python (OpenStack PyCQA). Reports
  insecure calls such as shell=True, pickle, eval, weak hashes, SQL built
  from strings and hard-coded passwords, each with a CWE id.
docs_url: https://bandit.readthedocs.io/
icon: shield-alert
display_order: 10
mem_limit: 512m
timeout_s: 180
notes: >-
  Run on the selected files only with --ignore-nosec (an app's "# nosec"
  cannot hide a finding) and without -c, so no app config is read. Files
  bandit cannot parse are reported as coverage, not findings. --exclude ""
  turns off bandit's default excludes, which drop any path containing .git,
  CVS, .hg, .tox... as a substring; coverage comes from the files bandit's
  report lists, so a file it passed over is skipped, never "clean".
config_schema:
  - name: severity
    type: select
    label: Minimum severity
    description: Report only issues at or above this severity (--severity-level).
    default: all
    options:
      - {value: all, label: All}
      - {value: low, label: Low}
      - {value: medium, label: Medium}
      - {value: high, label: High}
  - name: confidence
    type: select
    label: Minimum confidence
    description: Report only issues at or above this confidence (--confidence-level).
    default: all
    options:
      - {value: all, label: All}
      - {value: low, label: Low}
      - {value: medium, label: Medium}
      - {value: high, label: High}
  - name: skip
    type: string
    label: Skipped tests
    description: Comma-separated bandit test ids not to run (--skip), e.g. B101,B404.
    default: ""
    pattern: '^(B[0-9]{3}(,B[0-9]{3})*)?$'
    placeholder: B101,B404
