# detect-secrets: Yelp's secret scanner (keyword, entropy and provider detectors).
slug: detect-secrets
name: detect-secrets
kind: static
category: secrets
version: "1.5.0"
adapter_version: 2
languages: ["*"]
file_kinds: [source, config, manifest, doc, env, other]
output_kind: findings
description: >-
  Secret scanner using provider-specific detectors (AWS, GitHub, Stripe,
  JWT, private keys...), secret keywords and high-entropy strings.
docs_url: https://github.com/Yelp/detect-secrets
icon: key
display_order: 90
mem_limit: 512m
timeout_s: 180
notes: >-
  Scans the selected files from /src with --all-files, without network
  verification (--no-verify) and with the inline allowlist filter disabled,
  so "pragma: allowlist secret" cannot hide a finding. The *swagger* path
  filter is disabled; files detect-secrets never scans (non-text extensions
  such as .css/.map/.svg, lock files) are reported as skipped and never
  passed to it.
config_schema:
  - name: base64_limit
    type: number
    label: Base64 entropy limit
    description: Entropy threshold for high-entropy base64 strings (--base64-limit).
    default: 4.5
    min: 0
    max: 8
  - name: hex_limit
    type: number
    label: Hex entropy limit
    description: Entropy threshold for high-entropy hex strings (--hex-limit).
    default: 3.0
    min: 0
    max: 8
