# mypy: Python type checker.
slug: mypy
name: Mypy
kind: static
category: types
version: "2.4.0"
adapter_version: 2
languages: [python]
file_kinds: [source, config]
output_kind: findings
description: >-
  Static type checker for Python. Third-party imports are treated as Any (the
  app's dependencies are not installed), files that do not parse are left
  out of the check and reported as coverage gaps, and imports of such files
  are not followed, so one broken file cannot hide the type errors of the
  others.
docs_url: https://mypy.readthedocs.io/
icon: check-check
display_order: 60
mem_limit: 768m
timeout_s: 300
notes: >-
  Baked config (--config-file), MYPYPATH=/src with explicit package bases (no
  "Duplicate module" aborts), --no-site-packages, cache disabled. A wrapper
  parses and compiles every file first with the same interpreter, passes only
  those that compile to mypy, sets follow_imports = skip for the modules that
  do not, neutralizes "# mypy:" inline configuration comments and re-runs
  mypy (bounded) if it still blocks on syntax errors in sample files.
config_schema:
  - name: check_untyped_defs
    type: boolean
    label: Check untyped functions
    description: Type-check the bodies of functions without annotations (--check-untyped-defs); generated code is mostly unannotated.
    default: true
  - name: python_version
    type: select
    label: Python version
    description: Python version to check against (--python-version).
    default: "3.12"
    options:
      - {value: "3.10", label: Python 3.10}
      - {value: "3.11", label: Python 3.11}
      - {value: "3.12", label: Python 3.12}
