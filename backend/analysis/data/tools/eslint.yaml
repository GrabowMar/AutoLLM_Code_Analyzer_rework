slug: eslint
name: ESLint
description: >-
  The pluggable linter for JavaScript and TypeScript. JavaScript files
  (.js, .jsx, .cjs, .mjs): undefined names and unused variables. TypeScript
  files (.ts, .tsx): eslint:recommended plus the typescript-eslint
  recommended set (unused variables, explicit any, unsafe declarations,
  banned ts-comments); no type information is needed, so the app's
  dependencies are not installed.
category: lint
kind: container
target_language: javascript
analysis_mode: static
technologies: [javascript]
icon: braces
version: "8"
docs_url: https://eslint.org/docs/latest/
install_cmd: "npm install -g eslint@8 eslint-plugin-react@7 @typescript-eslint/parser@7 @typescript-eslint/eslint-plugin@7 typescript@5"
verify_cmd: "eslint --version && npm ls -g @typescript-eslint/parser @typescript-eslint/eslint-plugin >/dev/null"
uninstall_cmd: "npm uninstall -g eslint @typescript-eslint/parser @typescript-eslint/eslint-plugin"
# es2022 is needed alongside browser/node: without it Promise, Set, etc. are
# "not defined" and no-undef floods the results with false positives. The react
# plugin's jsx-uses-vars rules only mark JSX-referenced components as used (they
# never report): without them every imported component is "unused".
run_cmd: |
  g="$(npm root -g)"; printf '%s' '{"root":true,"env":{"browser":true,"node":true,"es2022":true},"parserOptions":{"ecmaVersion":"latest","sourceType":"module","ecmaFeatures":{"jsx":true}},"settings":{"react":{"version":"19.2"}},"plugins":["react"],"rules":{"no-undef":"error","no-unused-vars":"warn","react/jsx-uses-vars":"error","react/jsx-uses-react":"error"},"overrides":[{"files":["*.ts","*.tsx","*.mts","*.cts"],"parser":"PARSER","plugins":["@typescript-eslint","react"],"extends":["eslint:recommended","plugin:@typescript-eslint/recommended"],"rules":{"no-undef":"off","react/jsx-uses-vars":"error","react/jsx-uses-react":"error"}}]}' | sed "s#PARSER#$g/@typescript-eslint/parser/dist/index.js#" > /tmp/eslint-base.json
  eslint {target} --ext .js,.jsx,.cjs,.mjs,.ts,.tsx,.mts,.cts -f json --no-eslintrc -c /tmp/eslint-base.json --resolve-plugins-relative-to "$g" --ignore-pattern node_modules 2>/dev/null
parser_key: eslint
file_patterns: ["*.js", "*.jsx", "*.cjs", "*.mjs", "*.ts", "*.tsx", "*.mts", "*.cts"]
run_timeout: 120
install_timeout: 300
display_order: 30
config_schema: []
default_config: {}
sample_code: |
  var unused = 42;

  function greet(name) {
    console.log("hi " + missingVar);
  }
