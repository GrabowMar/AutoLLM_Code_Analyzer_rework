# radon: Python code metrics (cyclomatic complexity, maintainability index, raw).
slug: radon
name: Radon
kind: metrics
category: complexity
version: "6.0.1"
adapter_version: 2
languages: [python]
file_kinds: [source, config]
output_kind: mixed
description: >-
  Python metrics: cyclomatic complexity per function/method/class (ranks
  A-F), maintainability index and raw line counts. Blocks at or above the
  finding rank become complexity findings.
docs_url: https://radon.readthedocs.io/
icon: gauge
display_order: 100
mem_limit: 512m
timeout_s: 180
notes: >-
  Runs radon cc, mi and raw on the selected files, each writing its JSON
  report to /out. Files radon cannot parse are coverage gaps. radon reads
  only *.py files: .pyi/.pyw files are reported as skipped and never passed
  to it.
config_schema:
  - name: finding_min_rank
    type: select
    label: Finding rank
    description: Blocks of this cyclomatic-complexity rank or worse are reported as findings (C 11+, D 21+, E 31+, F 41+).
    default: E
    applies_to: interpretation
    options:
      - {value: C, label: C (11+)}
      - {value: D, label: D (21+)}
      - {value: E, label: E (31+)}
      - {value: F, label: F (41+)}
