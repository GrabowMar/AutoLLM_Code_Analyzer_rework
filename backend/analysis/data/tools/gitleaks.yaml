# Gitleaks: secret scanner (upstream default rules).
slug: gitleaks
name: Gitleaks
kind: static
category: secrets
version: "8.30.1"
adapter_version: 2
languages: ["*"]
file_kinds: [source, config, manifest, doc, env, other]
output_kind: findings
description: >-
  Secret scanner: hard-coded API keys, tokens, passwords and private keys in
  any text file, using the upstream gitleaks rule set.
docs_url: https://github.com/gitleaks/gitleaks
icon: key-round
display_order: 80
mem_limit: 512m
timeout_s: 180
notes: >-
  The selected files are copied into a fresh tmpfs directory and scanned with
  `gitleaks dir`, an explicit --config and --ignore-gitleaks-allow, so an
  app's .gitleaks.toml, .gitleaksignore or "gitleaks:allow" comments cannot
  hide anything. Secrets are redacted in the report; the exit code is
  checked (--exit-code 0 makes any non-zero status an error). Paths the
  default global allowlist always skips (bootstrap*/jquery*/angular*.js,
  swagger-ui*.js, gradlew, go.sum, lock files...) are reported as skipped
  and never passed to it.
config_schema: []
