slug: gitleaks
name: Gitleaks
description: >-
  Secret scanner. Detects hardcoded passwords, API keys, tokens and other
  credentials accidentally committed into source code.
category: secrets
kind: container
target_language: any
analysis_mode: static
technologies: [generic]
icon: key-round
version: "8.18"
docs_url: https://github.com/gitleaks/gitleaks
# sha256 from the release's gitleaks_8.18.4_checksums.txt.
install_cmd: >-
  set -e;
  mkdir -p /home/analyzer/.local/bin && cd /tmp;
  curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz;
  echo "ba6dbb656933921c775ee5a2d1c13a91046e7952e9d919f9bac4cec61d628e7d  gitleaks.tgz" | sha256sum -c -;
  tar -xzf gitleaks.tgz -C /home/analyzer/.local/bin gitleaks && rm -f gitleaks.tgz
verify_cmd: "gitleaks version"
uninstall_cmd: "rm -f /home/analyzer/.local/bin/gitleaks"
# Write the JSON report to a file and cat only that, sending gitleaks' banner
# and logs to /dev/null — otherwise the ASCII banner/ANSI logs pollute stdout.
run_cmd: "rm -f /tmp/gitleaks-report.json; gitleaks detect --no-git --source {target} --report-format json --report-path /tmp/gitleaks-report.json --exit-code 0 --redact --no-banner --log-level error >/dev/null 2>&1; cat /tmp/gitleaks-report.json"
parser_key: gitleaks
run_timeout: 180
install_timeout: 300
display_order: 60
config_schema: []
default_config: {}
sample_code: |
  AWS_ACCESS_KEY_ID = "AKIAIOSFODNN7EXAMPLE"
  AWS_SECRET_ACCESS_KEY = "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"
