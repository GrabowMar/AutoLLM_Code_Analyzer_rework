# hadolint: Dockerfile linter.
slug: hadolint
name: Hadolint
kind: static
category: container
version: "2.15.1"
adapter_version: 1
languages: [dockerfile]
file_kinds: ["*"]
output_kind: findings
description: >-
  Dockerfile linter (best practices, pinned base images, ShellCheck on RUN).
  Usually not applicable: generated apps' Dockerfiles are platform-owned.
docs_url: https://github.com/hadolint/hadolint
icon: container
display_order: 140
default_required: false
mem_limit: 256m
timeout_s: 120
notes: >-
  Baked config (--config) and --disable-ignore-pragma, so neither an app's
  .hadolint.yaml nor "# hadolint ignore=" comments apply. DL1000 (the
  Dockerfile does not parse) is a coverage gap, not a finding.
config_schema:
  - name: ignore_rules
    type: string
    label: Ignored rules
    description: Comma-separated DL/SC rule codes to ignore (--ignore).
    default: ""
    pattern: '^((DL|SC)[0-9]{4}(,(DL|SC)[0-9]{4})*)?$'
