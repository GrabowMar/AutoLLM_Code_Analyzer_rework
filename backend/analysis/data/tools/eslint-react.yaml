slug: eslint-react
name: ESLint React
description: >-
  React-specific bug finder: Rules of Hooks violations, missing effect
  dependencies, list items without keys, unsafe target="_blank" links and
  dangerouslySetInnerHTML, via eslint-plugin-react and react-hooks.
category: lint
kind: container
target_language: javascript
icon: atom
version: "7"
docs_url: https://github.com/jsx-eslint/eslint-plugin-react
install_cmd: "npm install -g eslint@8 eslint-plugin-react@7 eslint-plugin-react-hooks@4"
verify_cmd: "eslint --version && npm ls -g eslint-plugin-react eslint-plugin-react-hooks >/dev/null"
uninstall_cmd: "npm uninstall -g eslint-plugin-react eslint-plugin-react-hooks"
run_cmd: |
  printf '%s' '{"root":true,"env":{"browser":true,"node":true,"es2022":true},"parserOptions":{"ecmaVersion":"latest","sourceType":"module","ecmaFeatures":{"jsx":true}},"settings":{"react":{"version":"18.2"}},"extends":["plugin:react/recommended","plugin:react/jsx-runtime","plugin:react-hooks/recommended"],"rules":{"react/prop-types":"off","react/no-danger":"warn"}}' > /tmp/eslint-react.json
  eslint {target} --ext .js,.jsx,.cjs,.mjs -f json --no-eslintrc -c /tmp/eslint-react.json --resolve-plugins-relative-to "$(npm root -g)" --ignore-pattern node_modules 2>/dev/null
parser_key: eslint
run_timeout: 120
install_timeout: 300
display_order: 35
sample_filename: App.jsx
sample_code: |
  import { useState, useEffect } from "react";

  export function List({ items, ready }) {
    if (ready) {
      const [open] = useState(false);
    }
    useEffect(() => { console.log(items); }, []);
    return <ul>{items.map((i) => <li>{i}</li>)}</ul>;
  }
