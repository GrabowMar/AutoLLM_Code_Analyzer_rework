slug: eslint-react
name: ESLint React
description: >-
  React-specific bug finder: Rules of Hooks violations, missing effect
  dependencies, list items without keys, unsafe target="_blank" links and
  dangerouslySetInnerHTML, via eslint-plugin-react and react-hooks.
category: lint
kind: container
target_language: javascript
analysis_mode: static
technologies: [javascript, react]
icon: atom
version: "7"
docs_url: https://github.com/jsx-eslint/eslint-plugin-react
install_cmd: "npm install -g eslint@8 eslint-plugin-react@7 eslint-plugin-react-hooks@4 @typescript-eslint/parser@7 @typescript-eslint/eslint-plugin@7 typescript@5"
verify_cmd: "eslint --version && npm ls -g eslint-plugin-react eslint-plugin-react-hooks @typescript-eslint/parser >/dev/null"
uninstall_cmd: "npm uninstall -g eslint-plugin-react eslint-plugin-react-hooks"
run_cmd: |
  g="$(npm root -g)"; printf '%s' '{"root":true,"env":{"browser":true,"node":true,"es2022":true},"parserOptions":{"ecmaVersion":"latest","sourceType":"module","ecmaFeatures":{"jsx":true}},"settings":{"react":{"version":"19.2"}},"extends":["plugin:react/recommended","plugin:react/jsx-runtime","plugin:react-hooks/recommended"],"rules":{"react/prop-types":"off","react/no-danger":"warn"},"overrides":[{"files":["*.ts","*.tsx","*.mts","*.cts"],"parser":"PARSER"}]}' | sed "s#PARSER#$g/@typescript-eslint/parser/dist/index.js#" > /tmp/eslint-react.json
  eslint {target} --ext .js,.jsx,.cjs,.mjs,.ts,.tsx,.mts,.cts -f json --no-eslintrc -c /tmp/eslint-react.json --resolve-plugins-relative-to "$g" --ignore-pattern node_modules 2>/dev/null
parser_key: eslint
file_patterns: ["*.js", "*.jsx", "*.cjs", "*.mjs", "*.ts", "*.tsx", "*.mts", "*.cts"]
run_timeout: 120
install_timeout: 300
display_order: 35
sample_filename: App.jsx
sample_code: |
  import { useState, useEffect } from "react";

  export function List({ items, ready }) {
    if (ready) {
      const [open] = useState(false);
    }
    useEffect(() => { console.log(items); }, []);
    return <ul>{items.map((i) => <li>{i}</li>)}</ul>;
  }
