slug: djlint
name: djLint
description: >-
  Linter for HTML templates — Jinja (Flask) and Django templates as well as
  plain HTML (.html, .jinja, .jinja2, .j2). Flags accessibility gaps, missing
  attributes, unsafe inline markup and malformed template tags. The SEO hints
  H030/H031 (meta description, meta keywords) are not reported.
category: lint
kind: container
target_language: html
analysis_mode: static
technologies: [html, jinja]
icon: file-code
version: "1.36"
docs_url: https://www.djlint.com/docs/linter/
install_cmd: >-
  set -e;
  python3 -m venv /home/analyzer/.local/opt/djlint;
  /home/analyzer/.local/opt/djlint/bin/pip install --upgrade 'djlint==1.36.*';
  mkdir -p /home/analyzer/.local/bin;
  ln -sf /home/analyzer/.local/opt/djlint/bin/djlint /home/analyzer/.local/bin/djlint
verify_cmd: "djlint --version"
uninstall_cmd: "rm -rf /home/analyzer/.local/opt/djlint /home/analyzer/.local/bin/djlint"
# A machine-readable line format; the progress bar lines are ignored by the parser.
# djLint lints one extension per run (default html), so one pass per
# template extension present (newer djLint exits 1 on "No files to check!").
# A pass whose files djLint itself excludes prints that and exits 0 (1.36):
# the parser fails the result when no pass linted anything. Exit 1 means
# lint errors; a pass exiting higher crashed (an llmlab-warning line).
run_cmd: >-
  rc=0; for ext in html jinja jinja2 j2; do
  [ -n "$(find {target} -name "*.$ext" -not -path '*/node_modules/*' -print -quit)" ] || continue;
  djlint {target} --extension=$ext --lint --profile={config:profile} --ignore=H030,H031
  --linter-output-format '{filename}:{line}:{code}:{message}' 2>/dev/null;
  r=$?; [ $r -le 1 ] || echo "llmlab-warning: djlint --extension=$ext exited with code $r";
  [ $r -le $rc ] || rc=$r; done; exit $rc
parser_key: djlint
file_patterns: ["*.html", "*.jinja", "*.jinja2", "*.j2"]
run_timeout: 120
install_timeout: 300
display_order: 75
config_schema:
  - name: profile
    type: select
    label: Template profile
    description: Template language the rules assume.
    default: jinja
    options:
      - { value: jinja, label: Jinja (Flask) }
      - { value: django, label: Django }
      - { value: html, label: Plain HTML }
default_config:
  profile: jinja
sample_filename: index.html
sample_code: |
  <html><body>
  <img src="logo.png">
  {{ name|safe }}
  </body></html>
