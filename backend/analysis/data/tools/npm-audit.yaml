slug: npm-audit
name: npm audit
description: >-
  Checks JavaScript dependencies against the GitHub advisory database. Resolves
  a lockfile from each package.json (no packages are installed) and reports
  vulnerable direct and transitive packages. Needs network access.
category: dependencies
kind: container
target_language: javascript
analysis_mode: static
technologies: [javascript, npm]
icon: package-x
version: "10"
docs_url: https://docs.npmjs.com/cli/commands/npm-audit
# npm ships with the base image's Node.js; nothing to install.
install_cmd: ""
verify_cmd: "npm --version"
run_cmd: |
  omit="$( [ {config:production_only} = true ] && echo --omit=dev )"
  cd {target} && find . -name package.json -not -path '*/node_modules/*' | sort | while IFS= read -r f; do
    rm -rf /tmp/npm-audit && mkdir -p /tmp/npm-audit
    cp "$f" /tmp/npm-audit/
    lock="$(dirname "$f")/package-lock.json"
    [ -f "$lock" ] && cp "$lock" /tmp/npm-audit/
    echo "### ${f#./}"
    (cd /tmp/npm-audit && if [ ! -f package-lock.json ] && ! npm install --package-lock-only --ignore-scripts --no-audit --no-fund >/tmp/npm-install.log 2>&1; then
      grep -E 'not in this registry|No matching version|npm error code' /tmp/npm-install.log | head -n 20 | sed 's/^/!! /'
    else
      npm audit --json $omit 2>/dev/null
    fi)
    echo
  done
parser_key: npm_audit
file_patterns: ["package.json"]
run_timeout: 300
install_timeout: 60
display_order: 20
# production_only: dev-only packages (vite, eslint, …) never ship with the
# built app, so their advisories (mostly dev-server issues) are left out by
# default. A failed lockfile resolution (a hallucinated package or version) is
# echoed as "!! " lines and reported as nonexistent-package/-version findings.
config_schema:
  - name: production_only
    type: boolean
    label: Production dependencies only
    description: Skip advisories that only affect devDependencies.
    default: true
default_config:
  production_only: true
sample_filename: package.json
sample_code: |
  {
    "name": "sample",
    "version": "1.0.0",
    "dependencies": { "lodash": "4.17.15", "axios": "0.21.0" }
  }
