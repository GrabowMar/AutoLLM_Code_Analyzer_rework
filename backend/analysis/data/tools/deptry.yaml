# deptry: Python dependency problems (ported from the v1 tool shop).
slug: deptry
name: deptry
kind: static
category: lint
version: "0.25.1"
adapter_version: 1
languages: [python, text]
file_kinds: [source, config, manifest]
output_kind: findings
description: >-
  Compares each project's requirements.txt with the imports of its Python
  code: modules imported but not declared (the app fails at import time),
  declared packages nothing imports, and development dependencies used by
  application code.
docs_url: https://deptry.com/
icon: boxes
display_order: 150
default_enabled: false
default_required: false
mem_limit: 512m
timeout_s: 180
notes: >-
  Runs once per directory holding a requirements.txt, on staged copies of
  that project's Python and requirement files only (the app's pyproject
  [tool.deptry], .gitignore and excluded files are never seen), with a
  baked --config and no default excludes. Offline: the app's packages are
  not installed, so import names come from a baked package -> module map
  (deptry assumes name == module otherwise) and transitive dependencies
  cannot be told apart from undeclared ones. Python files outside every
  project are coverage gaps. Unused-dependency findings sit on the
  requirements file, which is not measured code.
config_schema:
  - name: ignore
    type: string
    label: Ignored rules
    description: Comma-separated deptry codes to ignore (--ignore).
    default: ""
    pattern: '^(DEP00[1-5](,DEP00[1-5])*)?$'
    placeholder: DEP002
