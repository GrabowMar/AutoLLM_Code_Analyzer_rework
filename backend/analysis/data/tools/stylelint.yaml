# Stylelint: CSS linter (ported from the v1 tool shop).
slug: stylelint
name: Stylelint
kind: static
category: lint
version: "17.16.0"
adapter_version: 1
languages: [css]
file_kinds: [source]
output_kind: findings
description: >-
  CSS linter with stylelint-config-recommended: unknown properties, units,
  functions and pseudo-selectors, invalid colors, duplicate selectors and
  properties, and other likely mistakes (Tailwind at-rules allowed).
docs_url: https://stylelint.io/
icon: palette
display_order: 180
default_enabled: false
default_required: false
mem_limit: 512m
timeout_s: 120
notes: >-
  Baked --config (stylelint-config-recommended 18.0.0) resolved inside the
  image, --ignore-disables (an app's stylelint-disable comments cannot hide
  a problem); no .stylelintrc or .stylelintignore of the app applies. CSS
  syntax errors are coverage gaps. SCSS, Sass and Less files are skipped
  (no such syntax is installed).
config_schema: []
