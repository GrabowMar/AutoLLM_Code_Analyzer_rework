# HTMLHint: static analysis of HTML (ported from the v1 tool shop).
slug: htmlhint
name: HTMLHint
kind: static
category: lint
version: "1.9.2"
adapter_version: 1
languages: [html]
file_kinds: [source]
output_kind: findings
description: >-
  Static analysis of HTML documents and templates: unpaired tags, duplicate
  ids and attributes, empty src attributes, images without alt text, a
  missing doctype or title and markup style (lowercase names, quoting).
docs_url: https://htmlhint.com/
icon: file-code
display_order: 170
default_enabled: false
default_required: false
mem_limit: 512m
timeout_s: 120
notes: >-
  Baked --config (HTMLHint's default rules plus alt-require), so an app's
  .htmlhintrc is never read; inline "<!-- htmlhint rule:false -->" comments
  are neutralized in staged copies. Jinja/Vue template syntax is plain text
  to HTMLHint, so partial templates (no doctype/title) get document-level
  style findings.
config_schema: []
