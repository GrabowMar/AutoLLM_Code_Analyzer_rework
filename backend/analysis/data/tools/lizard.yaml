slug: lizard
name: Lizard
description: >-
  Cyclomatic complexity and function length for Python and JavaScript/JSX
  alike. Reports per-function metrics and flags functions too complex to
  maintain or test.
category: performance
kind: container
target_language: any
analysis_mode: static
technologies: [python, javascript]
icon: activity
version: "1.17"
docs_url: https://github.com/terryyin/lizard
install_cmd: "pip install --user --upgrade 'lizard==1.17.*'"
verify_cmd: "lizard --version"
uninstall_cmd: "pip uninstall -y lizard"
# Lizard parses only the languages named with -l: .jsx and .tsx have their own
# readers ("jsx", "tsx"), so without them React components are silently not
# analyzed. The preamble counts the source files per extension (config files
# like vite.config.js hold no functions) so the parser can flag an extension
# that yielded no function at all.
run_cmd: |
  find {target} -name node_modules -prune -o -type f \( -name '*.py' -o -name '*.js' -o -name '*.jsx' -o -name '*.ts' -o -name '*.tsx' \) -not -name '*.config.*' -print | sed -n 's/.*\.\([A-Za-z]*\)$/\1/p' | sort | uniq -c | while read -r n ext; do echo "# files: $ext $n"; done
  lizard {target} --csv -l python -l javascript -l typescript -l jsx -l tsx -x '*/node_modules/*' 2>/dev/null
parser_key: lizard
file_patterns: ["*.py", "*.js", "*.jsx", "*.ts", "*.tsx"]
output_kind: mixed
run_timeout: 120
install_timeout: 120
display_order: 20
sample_code: |
  def grade(score, bonus, late, curve):
      if score > 90:
          if bonus and not late:
              return "A+"
          return "A"
      elif score > 80:
          return "B" if not late else "C"
      elif score > 70 and curve:
          return "C"
      elif score > 60 or (bonus and curve):
          return "D"
      for _ in range(3):
          if late:
              score -= 5
      return "F"
