slug: llm_review
name: AI Reviewer
description: >-
  An LLM-powered code reviewer that reads the code and reports security, bug,
  and quality findings in natural language. Uses any model in your model
  catalog (OpenRouter or a local endpoint); other model ids go to OpenRouter
  and need an OpenRouter API key.
category: ai
kind: ai
target_language: any
analysis_mode: static
technologies: [generic]
icon: bot
version: ""
install_cmd: ""
verify_cmd: ""
run_cmd: ""
parser_key: ""
run_timeout: 180
install_timeout: 30
display_order: 40
config_schema:
  - name: model
    type: string
    label: Model
    description: Model id for the review (a catalog model, OpenRouter or local; otherwise sent to OpenRouter).
    default: anthropic/claude-opus-5.5
    placeholder: anthropic/claude-opus-5.5
  - name: max_tokens
    type: number
    label: Max tokens
    description: Maximum tokens for the review response.
    default: 8000
    min: 500
    max: 16000
default_config:
  model: anthropic/claude-opus-5.5
  max_tokens: 8000
sample_code: ""
