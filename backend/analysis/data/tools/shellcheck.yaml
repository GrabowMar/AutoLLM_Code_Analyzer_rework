# ShellCheck: static analysis of shell scripts (ported from the v1 tool shop).
slug: shellcheck
name: ShellCheck
kind: static
category: lint
version: "0.11.0"
adapter_version: 1
languages: [shell]
file_kinds: [source, config]
output_kind: findings
description: >-
  Static analysis of sh/bash scripts: unquoted expansions, word-splitting
  and globbing bugs, unchecked cd, dangerous rm -rf expansions and
  portability problems.
docs_url: https://www.shellcheck.net/
icon: terminal
display_order: 190
default_enabled: false
default_required: false
mem_limit: 256m
timeout_s: 120
notes: >-
  --norc (no .shellcheckrc of the app); "# shellcheck disable=" directives
  are neutralized in staged copies. Scripts that do not parse are coverage
  gaps. zsh scripts are skipped (not supported by ShellCheck).
config_schema:
  - name: severity
    type: select
    label: Minimum severity
    description: Lowest ShellCheck level reported (--severity).
    default: style
    options:
      - {value: error, label: error}
      - {value: warning, label: warning}
      - {value: info, label: info}
      - {value: style, label: style}
  - name: exclude
    type: string
    label: Excluded checks
    description: Comma-separated SC codes to exclude (--exclude).
    default: ""
    pattern: '^(SC[0-9]{4}(,SC[0-9]{4})*)?$'
    placeholder: SC2086
