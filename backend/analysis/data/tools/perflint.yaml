slug: perflint
name: Perflint
description: >-
  Pylint plugin for Python performance anti-patterns: loop-invariant
  statements, try/except inside loops, needless list() casts, iterating
  dict.keys(), and loops that should be comprehensions or list copies.
category: performance
kind: container
target_language: python
analysis_mode: static
technologies: [python]
icon: zap
version: "0.8"
docs_url: https://github.com/tonybaloney/perflint
# Own venv: perflint pins its pylint, which must not fight the Pylint tool.
install_cmd: >-
  python -m venv /home/analyzer/.venvs/perflint &&
  /home/analyzer/.venvs/perflint/bin/pip install --upgrade 'perflint==0.8.*' &&
  mkdir -p /home/analyzer/.local/bin &&
  ln -sf /home/analyzer/.venvs/perflint/bin/perflint /home/analyzer/.local/bin/perflint
verify_cmd: "perflint --version"
uninstall_cmd: "rm -rf /home/analyzer/.venvs/perflint /home/analyzer/.local/bin/perflint"
run_cmd: "perflint {target} --output-format=json --exit-zero --ignore=node_modules,.venv 2>/dev/null"
parser_key: perflint
file_patterns: ["*.py"]
run_timeout: 180
install_timeout: 300
display_order: 30
sample_code: |
  def doubled(items):
      out = []
      for i in items:
          out.append(i * 2)
      return out


  def total(prices):
      result = 0
      for p in list(prices):
          try:
              result += float(p)
          except ValueError:
              pass
      return result
