# perflint: Python performance anti-patterns (a pylint plugin; ported from the v1 tool shop).
slug: perflint
name: Perflint
kind: static
category: lint
version: "0.8.1"
adapter_version: 1
languages: [python]
file_kinds: [source, config]
output_kind: findings
description: >-
  Performance anti-patterns in Python: loop-invariant statements, global
  lookups and dotted imports inside loops, needless list() casts, iterating
  dict items for keys or values only, and loops that should be
  comprehensions or list copies. Reported as maintainability findings.
docs_url: https://github.com/tonybaloney/perflint
icon: zap
display_order: 55
default_enabled: false
default_required: false
mem_limit: 768m
timeout_s: 300
notes: >-
  perflint 0.8.1 requires pylint < 4, so it runs the pylint 3.3.9 of its own
  venv (the Pylint tool's 4.x is unaffected) with a baked rcfile that
  enables only perflint's checkers; loop-try-except-usage (Python < 3.11
  only) is off. Inline "# pylint: disable" comments are recovered like for
  Pylint (suppressed_inline findings), whole-file pragmas are neutralized.
config_schema:
  - name: report_suppressed
    type: boolean
    label: Report inline-suppressed messages
    description: >-
      Keep messages the app disabled with "# pylint: disable" comments (as
      suppressed_inline findings).
    default: true
  - name: extra_disable
    type: string
    label: Disabled messages
    description: Comma-separated perflint message ids or symbols to disable (--disable).
    default: ""
    pattern: '^([A-Za-z0-9-]+(,[A-Za-z0-9-]+)*)?$'
