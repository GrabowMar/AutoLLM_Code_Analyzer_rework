# Static findings of category `secrets` (gitleaks, detect-secrets, the
# hardcoded-password checks of bandit/ruff, semgrep secret rules) on an
# example/test file or with a placeholder value are downgraded: they are
# documentation, not leaked credentials. AI findings keep the model's label.
secrets:
  category: secrets
  downgrade_to: low
  example_path_globs:
    - "**/*.example"
    - "**/*.example.*"
    - "**/.env.example"
    - "**/.env.sample"
    - "**/.env.template"
    - "**/*.sample"
    - "**/*.template"
    - "**/*.dist"
    - "**/test/**"
    - "**/tests/**"
    - "**/__tests__/**"
    - "**/__mocks__/**"
    - "**/fixtures/**"
    - "**/examples/**"
    - "**/docs/**"
    - "**/*.test.*"
    - "**/*.spec.*"
    - "**/test_*.py"
    - "**/*_test.py"
    - "**/conftest.py"
    - "**/*.md"
  # Case-insensitive regexes over the flagged source line.
  placeholder_patterns:
    - 'change[-_ ]?(this|me|it)'
    - 'changeme'
    - 'replace[-_ ]?(this|me)'
    - 'your[-_ ]?[a-z_-]*(key|secret|token|password|pass|pwd)'
    - 'placeholder'
    - 'example'
    - 'dummy'
    - 'not[-_ ]?a[-_ ]?real'
    - 'fake[-_ ]?(key|secret|token|password)'
    - 'x{6,}'
    - '\*{6,}'
    - '<[a-z0-9_ -]*(key|secret|token|password)[a-z0-9_ -]*>'
    - '\$\{[^}]+\}'
    - '\{\{[^}]+\}\}'
