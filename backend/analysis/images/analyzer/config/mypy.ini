# Baked mypy configuration of the llmlab analyzer (mypy 2.4).
# The adapter passes --config-file=<this file>, so an analysed app's mypy.ini,
# .mypy.ini, pyproject.toml or setup.cfg is never read. Per-run options
# (check_untyped_defs, python_version) are passed on the command line.
[mypy]
# Module names are derived from paths below /src (MYPYPATH), so app.py and
# tests/app.py are distinct modules instead of a fatal "Duplicate module".
explicit_package_bases = True
namespace_packages = True
# The app's third-party dependencies are not installed: their imports are Any.
ignore_missing_imports = True
# Never type-check against whatever packages the analyzer itself ships.
no_site_packages = True
# Imported app modules that were not selected are used for types only.
follow_imports = silent
cache_dir = /dev/null
# var-annotated: "Need type annotation" for an empty literal asks for an
#   annotation; it is not evidence of a type error and floods untyped code.
# name-defined: fires on dynamic base classes such as Flask-SQLAlchemy's
#   `class User(db.Model)` ("Name 'db.Model' is not defined", mypy#8603), a
#   false positive in nearly every generated Flask app; genuinely undefined
#   names are measured by ruff (F821) and pylint (E0602).
disable_error_code = var-annotated, name-defined
show_error_codes = True
show_column_numbers = True
show_error_end = True
error_summary = False
pretty = False
color_output = False
