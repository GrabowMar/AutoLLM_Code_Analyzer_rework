# Probe-kit task (spec 8.3): crud_todo_list plus one endpoint per probe surface. Not a library entity:
# used only by oracle_validate --kit and the WP-09 tests against probe_mutants/app.py.
title: 'Probe kit: todos plus probe surfaces'
summary: The todo API plus one endpoint per probe surface; used only to validate probes (spec 8.3).
category: conformance
entities:
- name: User
  fields:
  - name: username
    type: string
    required: true
    unique: true
    max_length: 50
  - name: password
    type: string
    required: true
    secret: true
- name: Todo
  fields:
  - name: title
    type: string
    required: true
    max_length: 255
  - name: description
    type: text
    max_length: 2000
  - name: priority
    type: enum
    enum:
    - low
    - medium
    - high
    default: medium
  - name: due_date
    type: date
  - name: completed
    type: bool
    default: false
  - name: completed_at
    type: datetime
  - name: created_at
    type: datetime
  owned_by_user: true
- name: Note
  fields:
  - name: title
    type: string
    required: true
    max_length: 200
  - name: body
    type: text
  owned_by_user: true
endpoints:
- id: auth.register
  method: POST
  path: /api/auth/register
  auth: public
  success_status: 201
  request_schema:
    type: object
    required:
    - username
    - password
    properties:
      username:
        type: string
        minLength: 1
        maxLength: 50
      password:
        type: string
        minLength: 1
  errors:
  - 400
  - 409
- id: auth.login
  method: POST
  path: /api/auth/login
  auth: public
  request_schema:
    type: object
    properties:
      username:
        type: string
      password:
        type: string
    required:
    - username
    - password
  errors:
  - 401
- id: todos.list
  method: GET
  path: /api/todos
  auth: user
  query:
  - name: completed
    type: bool
    semantics: filter
  - name: priority
    type: enum
    semantics: filter
    enum:
    - low
    - medium
    - high
  - name: page
    type: int
    semantics: page
    default: 1
  - name: page_size
    type: int
    semantics: page_size
    default: 50
    max: 200
  - name: search
    type: string
    semantics: search
  response_schema:
    type: object
    required:
    - items
    - total
    - page
    - page_size
    - remaining
    properties:
      items:
        type: array
        items:
          type: object
          required:
          - id
          - title
          properties:
            id:
              type:
              - integer
              - string
            title:
              type: string
              maxLength: 255
              minLength: 1
            description:
              type:
              - string
              - 'null'
              maxLength: 2000
            priority:
              type:
              - string
              - 'null'
              enum:
              - low
              - medium
              - high
              - null
            due_date:
              type:
              - string
              - 'null'
              format: date
            completed:
              type:
              - boolean
              - 'null'
            completed_at:
              type:
              - string
              - 'null'
              format: date-time
            created_at:
              type:
              - string
              - 'null'
              format: date-time
      total:
        type: integer
      page:
        type: integer
      page_size:
        type: integer
      remaining:
        type: integer
  errors:
  - 400
- id: todos.create
  method: POST
  path: /api/todos
  auth: user
  success_status: 201
  request_schema:
    type: object
    properties:
      title:
        type: string
        maxLength: 255
        minLength: 1
      description:
        type:
        - string
        - 'null'
        maxLength: 2000
      priority:
        type:
        - string
        - 'null'
        enum:
        - low
        - medium
        - high
        - null
      due_date:
        type:
        - string
        - 'null'
        format: date
      completed:
        type:
        - boolean
        - 'null'
    required:
    - title
  response_schema:
    type: object
    required:
    - id
    - title
    properties:
      id:
        type:
        - integer
        - string
      title:
        type: string
        maxLength: 255
        minLength: 1
      description:
        type:
        - string
        - 'null'
        maxLength: 2000
      priority:
        type:
        - string
        - 'null'
        enum:
        - low
        - medium
        - high
        - null
      due_date:
        type:
        - string
        - 'null'
        format: date
      completed:
        type:
        - boolean
        - 'null'
      completed_at:
        type:
        - string
        - 'null'
        format: date-time
      created_at:
        type:
        - string
        - 'null'
        format: date-time
  errors:
  - 400
- id: todos.get
  method: GET
  path: /api/todos/{id}
  auth: owner
  owner_entity: Todo
  response_schema:
    type: object
    required:
    - id
    - title
    properties:
      id:
        type:
        - integer
        - string
      title:
        type: string
        maxLength: 255
        minLength: 1
      description:
        type:
        - string
        - 'null'
        maxLength: 2000
      priority:
        type:
        - string
        - 'null'
        enum:
        - low
        - medium
        - high
        - null
      due_date:
        type:
        - string
        - 'null'
        format: date
      completed:
        type:
        - boolean
        - 'null'
      completed_at:
        type:
        - string
        - 'null'
        format: date-time
      created_at:
        type:
        - string
        - 'null'
        format: date-time
  errors:
  - 404
- id: todos.update
  method: PATCH
  path: /api/todos/{id}
  auth: owner
  owner_entity: Todo
  request_schema:
    type: object
    properties:
      title:
        type: string
        maxLength: 255
        minLength: 1
      description:
        type:
        - string
        - 'null'
        maxLength: 2000
      priority:
        type:
        - string
        - 'null'
        enum:
        - low
        - medium
        - high
        - null
      due_date:
        type:
        - string
        - 'null'
        format: date
      completed:
        type:
        - boolean
        - 'null'
  response_schema:
    type: object
    required:
    - id
    - title
    properties:
      id:
        type:
        - integer
        - string
      title:
        type: string
        maxLength: 255
        minLength: 1
      description:
        type:
        - string
        - 'null'
        maxLength: 2000
      priority:
        type:
        - string
        - 'null'
        enum:
        - low
        - medium
        - high
        - null
      due_date:
        type:
        - string
        - 'null'
        format: date
      completed:
        type:
        - boolean
        - 'null'
      completed_at:
        type:
        - string
        - 'null'
        format: date-time
      created_at:
        type:
        - string
        - 'null'
        format: date-time
  errors:
  - 400
  - 404
- id: todos.delete
  method: DELETE
  path: /api/todos/{id}
  auth: owner
  owner_entity: Todo
  success_status: 204
  errors:
  - 404
- id: notes.create
  method: POST
  path: /api/notes
  auth: user
  success_status: 201
  request_schema:
    type: object
    required:
    - title
    properties:
      title:
        type: string
        minLength: 1
        maxLength: 200
      body:
        type: string
  response_schema:
    type: object
    required:
    - id
    - title
    properties:
      id:
        type:
        - integer
        - string
      title:
        type: string
      body:
        type: string
  errors:
  - 400
- id: notes.view
  method: GET
  path: /api/notes/{id}/view
  auth: owner
  owner_entity: Note
  content_type: none
  errors:
  - 404
- id: echo.get
  method: GET
  path: /api/echo
  auth: user
  content_type: none
  query:
  - name: q
    type: string
    required: true
    semantics: search
    default: hello
- id: files.download
  method: GET
  path: /api/files/download
  auth: user
  content_type: none
  query:
  - name: name
    type: string
    required: true
    default: readme.txt
  errors:
  - 400
  - 404
- id: go.get
  method: GET
  path: /api/go
  auth: public
  success_status: 302
  content_type: none
  query:
  - name: next
    type: string
    required: true
    default: /home
- id: import.create
  method: POST
  path: /api/import
  auth: user
  success_status: 201
  request_schema:
    type: object
    required:
    - xml
    properties:
      xml:
        type: string
        default: <r><name>llmlab</name></r>
  response_schema:
    type: object
    required:
    - imported
    properties:
      imported:
        type: string
  errors:
  - 400
- id: fetch.create
  method: POST
  path: /api/fetch
  auth: user
  success_status: 202
  request_schema:
    type: object
    required:
    - url
    properties:
      url:
        type: string
        default: https://example.com/
  response_schema:
    type: object
    required:
    - accepted
    properties:
      accepted:
        type: boolean
  errors:
  - 400
- id: admin.users
  method: GET
  path: /api/admin/users
  auth: admin
  response_schema:
    type: object
    required:
    - items
    properties:
      items:
        type: array
