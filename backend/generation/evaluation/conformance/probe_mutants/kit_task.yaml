acceptance:
- id: todos.list.open_first
  category: functional
  endpoint: todos.list
  setup:
  - request:
      method: POST
      path: /api/todos
      json:
        title: done one
    expect_status: 201
    capture:
      done_id: $.id
  - request:
      method: PATCH
      path: /api/todos/{done_id}
      json:
        completed: true
    expect_status: 200
  - request:
      method: POST
      path: /api/todos
      json:
        title: open one
    expect_status: 201
  request:
    method: GET
    path: /api/todos
  expect:
    status: 200
    json_contains:
      items:
      - title: open one
      - title: done one
  stated_in:
  - standard
  - exhaustive
