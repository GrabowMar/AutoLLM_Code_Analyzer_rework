name: 'Plaintext password comparison (Python)'
description: 'A stored or submitted password is compared with == / != instead of verifying a hash.'
content:
  engine: regex
  languages: [python]
  rule: '(?<!confirm_)(?<!confirm)(?<!repeat_)(?i:passw(?:or)?d)(?!_?hash|_?digest|_?confirm)\w*(?:["'']\])?\s*(?:==|!=)\s*(?!None\b|["'']{2}|\w*confirm)[\w"''\[(]'
  tool: {name: re, version: py3.13}
  feature_key: py-plaintext-password-compare
  polarity: insecure
  cwe: [cwe-256]
  description: 'A password-named value is compared with == or != (no hash verification).'
