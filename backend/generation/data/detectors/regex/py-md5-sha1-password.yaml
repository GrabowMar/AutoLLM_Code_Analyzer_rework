name: 'MD5/SHA-1 password hashing (Python)'
description: 'A password is hashed with hashlib.md5 or hashlib.sha1 (fast, unsalted hashes unsuitable for passwords).'
content:
  engine: regex
  languages: [python]
  rule: '\bhashlib\.(?:md5|sha1)\s*\([^)\n]*(?i:passw|pwd|\bpw\b)|\bhashlib\.new\(\s*["''](?i:md5|sha1)["'']\s*,[^)\n]*(?i:passw|pwd|\bpw\b)'
  tool: {name: re, version: py3.13}
  feature_key: py-md5-sha1-password
  polarity: insecure
  cwe: [cwe-916, cwe-328]
  description: 'hashlib.md5/sha1 (or hashlib.new(''md5''/''sha1'')) is applied to a password-like value.'
