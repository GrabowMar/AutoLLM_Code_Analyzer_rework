name: Hard-coded secret literal (Python)
description: A variable or key named like a secret, password, token or API key is assigned a string literal.
content:
  engine: regex
  languages: [python]
  rule: '(?i)\b[a-z_]*(?:secret|password|passwd|api_?key|token)[a-z_]*["'']?\s*[:=]\s*["''][^"''\s]{10,}["'']'
  tool: {name: re, version: py3.13}
  feature_key: py-hardcoded-secret
  polarity: insecure
  cwe: [cwe-798]
  description: A secret-like name is bound to a string literal of ten or more characters.
