name: 'CORS wildcard or reflected origin with credentials (JS/TS)'
description: 'The cors() middleware allows any origin (''*'' or origin: true) together with credentials: true.'
content:
  engine: regex
  languages: [javascript, typescript, tsx, vue, svelte]
  rule: '\bcors\(\s*\{[^}]*\borigin\s*:\s*(?:["''`]\*["''`]|true)[^}]*\bcredentials\s*:\s*true|\bcors\(\s*\{[^}]*\bcredentials\s*:\s*true[^}]*\borigin\s*:\s*(?:["''`]\*["''`]|true)'
  tool: {name: re, version: py3.13}
  feature_key: js-cors-wildcard-credentials
  polarity: insecure
  cwe: [cwe-942]
  description: 'cors({...}) sets credentials: true with origin ''*'' or origin: true.'
