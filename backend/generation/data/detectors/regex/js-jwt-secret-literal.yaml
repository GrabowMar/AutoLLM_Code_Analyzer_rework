name: 'JWT secret as a string literal (JS/TS)'
description: 'jsonwebtoken sign/verify uses a literal secret, or the JWT secret has a hard-coded value or fallback.'
content:
  engine: regex
  languages: [javascript, typescript, tsx, vue, svelte]
  rule: '\bjwt\.(?:sign|verify)\s*\([^,\n]+,\s*["''`][^"''`\n]+["''`]|\b(?i:jwt_?secret)\w*["'']?\s*[:=]\s*["''`][^"''`\n]+["''`]|\b(?i:jwt_?secret)\w*\s*(?:\|\||\?\?)\s*["''`][^"''`\n]+["''`]'
  tool: {name: re, version: py3.13}
  feature_key: js-jwt-secret-literal
  polarity: insecure
  cwe: [cwe-798]
  description: 'A JWT is signed/verified with a literal secret, or the JWT secret is a literal or has a literal fallback.'
