name: Express (server-rendered, SQLite)
description: Express (TypeScript on Node.js 24) app with server-rendered pages; no separate frontend build.
content:
  choice_mode: fixed
  backend: {language: typescript, framework: express, runtime: node24}
  frontend: {framework: none, language: none, build_tool: none}
  database: sqlite
  run_contract: {port: 8000, api_prefix: /api, health_path: /api/health, static_serving: backend, data_dir: ./data, start: dockerfile}
  brief_fragment: stack-express-none@1
  adherence:
    backend_markers: [express]
    frontend_markers: []
    db_markers: [sqlite]
  resources: {min_memory: 2g, min_cpus: 1.0}
