name: Spring Boot + Svelte (SQLite)
description: Spring Boot 4 (Java 21, Maven) API serving a Vite Svelte (TypeScript) build.
content:
  choice_mode: fixed
  backend: {language: java, framework: spring-boot, runtime: temurin21}
  frontend: {framework: svelte, language: ts, build_tool: vite}
  database: sqlite
  run_contract: {port: 8000, api_prefix: /api, health_path: /api/health, static_serving: backend, data_dir: ./data, start: dockerfile}
  brief_fragment: stack-spring-boot-svelte@1
  adherence:
    backend_markers: [spring-boot-starter-webmvc]
    frontend_markers: [svelte]
    db_markers: [sqlite-jdbc]
  resources: {min_memory: 3g, min_cpus: 2.0}
