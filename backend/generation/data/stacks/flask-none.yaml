name: Flask (server-rendered, SQLite)
description: Flask (Python 3.13) app with server-rendered pages (Jinja templates); no separate frontend build.
content:
  choice_mode: fixed
  backend: {language: python, framework: flask, runtime: python3.13}
  frontend: {framework: none, language: none, build_tool: none}
  database: sqlite
  run_contract: {port: 8000, api_prefix: /api, health_path: /api/health, static_serving: backend, data_dir: ./data, start: dockerfile}
  brief_fragment: stack-flask-none@1
  adherence:
    backend_markers: [flask]
    frontend_markers: []
    db_markers: [sqlite3]
  resources: {min_memory: 2g, min_cpus: 1.0}
