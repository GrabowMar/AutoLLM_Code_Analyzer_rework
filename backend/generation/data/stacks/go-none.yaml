name: Go (server-rendered, SQLite)
description: Go 1.25 app on the standard library (net/http) with server-rendered pages (html/template); no separate frontend build.
content:
  choice_mode: fixed
  backend: {language: go, framework: go-stdlib, runtime: go1.25}
  frontend: {framework: none, language: none, build_tool: none}
  database: sqlite
  run_contract: {port: 8000, api_prefix: /api, health_path: /api/health, static_serving: backend, data_dir: ./data, start: dockerfile}
  brief_fragment: stack-go-none@1
  adherence:
    backend_markers: [net/http]
    frontend_markers: []
    db_markers: [modernc.org/sqlite]
  resources: {min_memory: 2g, min_cpus: 1.0}
