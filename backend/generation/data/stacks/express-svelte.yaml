name: Express + Svelte (SQLite)
description: Express (TypeScript on Node.js 24) API serving a Vite Svelte (TypeScript) build.
content:
  choice_mode: fixed
  backend: {language: typescript, framework: express, runtime: node24}
  frontend: {framework: svelte, language: ts, build_tool: vite}
  database: sqlite
  run_contract: {port: 8000, api_prefix: /api, health_path: /api/health, static_serving: backend, data_dir: ./data, start: dockerfile}
  brief_fragment: stack-express-svelte@1
  adherence:
    backend_markers: [express]
    frontend_markers: [svelte]
    db_markers: [sqlite]
  resources: {min_memory: 2g, min_cpus: 1.0}
