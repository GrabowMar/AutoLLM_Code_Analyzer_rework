name: Express + React (PostgreSQL)
description: Express (TypeScript on Node.js 24) API serving a Vite React (TypeScript) build, with a PostgreSQL database.
content:
  choice_mode: fixed
  backend: {language: typescript, framework: express, runtime: node24}
  frontend: {framework: react, language: ts, build_tool: vite}
  database: postgres
  run_contract: {port: 8000, api_prefix: /api, health_path: /api/health, static_serving: backend, data_dir: ./data, start: dockerfile}
  brief_fragment: stack-express-react-postgres@1
  adherence:
    backend_markers: [express]
    frontend_markers: [react]
    db_markers: [pg]
  resources: {min_memory: 3g, min_cpus: 1.0}
