slug: repair-instructions
version: 1
block_type: validation
name: Repair round instructions
description: >-
  User-message template for the single post-generation repair round: fed the
  original file plus the validation errors it failed, asks for a corrected
  full replacement.
metadata:
  role: repair_prompt
content: |
  The file `{{ filename }}` you generated fails validation and must be
  corrected. Fix the errors below without changing what the file does, and
  return the file in FULL: output the complete corrected file, not a
  description of the fix or a partial diff.

  ## Errors
  {% for error in errors %}
  - {{ error }}
  {% endfor %}

  ## File as generated
  ```
  {{ code }}
  ```

  Return ONLY the corrected file, as a single code block whose info string
  is its language and file name (for example `python:app.py` or `jsx:App.jsx`).
