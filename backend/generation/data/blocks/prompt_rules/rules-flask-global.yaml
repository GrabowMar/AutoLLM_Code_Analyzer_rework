slug: rules-flask-global
version: 1
block_type: prompt_rules
name: Flask global rules
description: Runtime and ORM constraints shared across Flask stacks
metadata:
  stage: backend
content: |
  ## Runtime rules
  - SQLite URI: `sqlite:////app/data/app.db` (absolute path of the writable `data/` directory)
  - Listen on `0.0.0.0`, port from the `PORT` env var defaulting to **8000**; started with `python app.py`
  - Run `db.create_all()`, the admin account and seed logic inside `with app.app_context():` under `if __name__ == "__main__":`
  - Serve the built SPA from `./static` through the `_serve_spa` catch-all (the last route); no `static_folder` on `Flask()`
  - Forbidden: `@app.before_first_request`, `Model.query` (use `db.session.execute(db.select(...))`, `db.session.get()`), `datetime.utcnow()`
