description: Balanced scope — every requirement implemented completely, no line-count targets or padding
content: |
  ## Generation tone
  Produce a complete, working application: implement every requirement completely, in clear and well-organised code.
  Do not add features the requirements do not ask for, and do not pad the code to reach a length.
  The backend seeds a small set of realistic sample records at startup, so every view has something to show on first start.
