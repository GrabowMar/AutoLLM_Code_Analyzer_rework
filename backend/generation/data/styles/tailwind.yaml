name: Tailwind CSS
description: Utility classes from Tailwind CSS.
content:
  system: tailwind
  library:
    name: tailwindcss
    packages: [tailwindcss, '@tailwindcss/vite']
    frameworks: [react, vue, svelte]
  fragment: style-tailwind@1
  adherence:
    required_markers: [tailwindcss]
  compatible_frontends: [react, vue, svelte, free]
