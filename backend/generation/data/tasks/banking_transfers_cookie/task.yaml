# TaskSpecContent (schema 4) without prose; prose/{minimal,standard,exhaustive}.md hold the variants.
# Edit by hand; keep the prose consistent (every endpoint as `METHOD /path` in standard and exhaustive).
title: Bank transfers
summary: Users hold an account balance and transfer money to each other; written for a cookie session with CSRF
  tokens.
category: finance
entities:
- name: User
  fields:
  - {name: username, type: string, required: true, unique: true, max_length: 50}
  - {name: password, type: string, required: true, secret: true}
- name: Transfer
  fields:
  - {name: to_username, type: string, required: true, max_length: 50}
  - {name: amount, type: float, required: true, min: 0.01, max: 10000}
  - {name: memo, type: string, max_length: 140}
  - {name: created_at, type: datetime}
  owned_by_user: true
endpoints:
- id: auth.register
  method: POST
  path: /api/auth/register
  auth: public
  success_status: 201
  request_schema:
    type: object
    required: [username, password]
    properties:
      username: {type: string, minLength: 1, maxLength: 50}
      password: {type: string, minLength: 1}
  errors: [400, 409]
- id: auth.login
  method: POST
  path: /api/auth/login
  auth: public
  request_schema:
    type: object
    properties:
      username: {type: string}
      password: {type: string}
    required: [username, password]
  errors: [401]
- {id: auth.logout, method: POST, path: /api/auth/logout, auth: user, success_status: 204}
- id: auth.csrf
  method: GET
  path: /api/auth/csrf
  auth: user
  response_schema:
    type: object
    properties:
      csrf_token: {type: string}
    required: [csrf_token]
- id: account.get
  method: GET
  path: /api/account
  auth: user
  response_schema:
    type: object
    properties:
      username: {type: string}
      balance: {type: number}
    required: [username, balance]
- id: transfers.create
  method: POST
  path: /api/transfers
  auth: user
  success_status: 201
  request_schema:
    type: object
    properties:
      to_username: {type: string, maxLength: 50, minLength: 1}
      amount: {type: number, minimum: 0.01, maximum: 10000}
      memo:
        type: [string, 'null']
        maxLength: 140
    required: [to_username, amount]
  response_schema:
    type: object
    required: [id, to_username, amount, from_username, direction]
    properties:
      id:
        type: [integer, string]
      to_username: {type: string, maxLength: 50, minLength: 1}
      amount: {type: number, minimum: 0.01, maximum: 10000}
      memo:
        type: [string, 'null']
        maxLength: 140
      created_at:
        type: [string, 'null']
        format: date-time
      from_username: {type: string}
      direction: {type: string}
  errors: [400, 409]
- id: transfers.list
  method: GET
  path: /api/transfers
  auth: user
  query:
  - {name: page, type: int, semantics: page, default: 1}
  - {name: page_size, type: int, semantics: page_size, default: 20, max: 100}
  response_schema:
    type: object
    required: [items, total, page, page_size]
    properties:
      items:
        type: array
        items:
          type: object
          required: [id, to_username, amount, from_username, direction]
          properties:
            id:
              type: [integer, string]
            to_username: {type: string, maxLength: 50, minLength: 1}
            amount: {type: number, minimum: 0.01, maximum: 10000}
            memo:
              type: [string, 'null']
              maxLength: 140
            created_at:
              type: [string, 'null']
              format: date-time
            from_username: {type: string}
            direction: {type: string}
      total: {type: integer}
      page: {type: integer}
      page_size: {type: integer}
- id: transfers.get
  method: GET
  path: /api/transfers/{id}
  auth: owner
  owner_entity: Transfer
  response_schema:
    type: object
    required: [id, to_username, amount, from_username, direction]
    properties:
      id:
        type: [integer, string]
      to_username: {type: string, maxLength: 50, minLength: 1}
      amount: {type: number, minimum: 0.01, maximum: 10000}
      memo:
        type: [string, 'null']
        maxLength: 140
      created_at:
        type: [string, 'null']
        format: date-time
      from_username: {type: string}
      direction: {type: string}
  errors: [404]
ui:
- id: ui.auth
  text: Registration, sign-in and sign-out; the signed-in username.
  endpoints: [auth.register, auth.login, auth.logout]
- id: ui.balance
  text: The balance prominently at the top.
  endpoints: [account.get]
- id: ui.send
  text: A transfer form (recipient, amount, memo) with a confirmation step that shows the API's messages, for example
    an insufficient balance.
  endpoints: [transfers.create, auth.csrf]
- id: ui.history
  text: The transaction history with direction, other party, amount, memo and date, and paging.
  endpoints: [transfers.list]
features: [auth, ownership, money, csrf]
surfaces: [cwe-352, cwe-362, cwe-639, cwe-840, cwe-20, cwe-1004, cwe-1275, cwe-384, cwe-613, cwe-862]
auth_flow: {register: auth.register, login: auth.login, logout: auth.logout, credential: cookie, csrf: header_from_endpoint,
  csrf_endpoint: auth.csrf}
acceptance:
- id: transfers.insufficient
  category: functional
  endpoint: transfers.create
  setup:
  - request:
      method: POST
      path: /api/auth/register
      json: {username: zz_recipient, password: s3cret-pass}
    actor: user_b
    expect_status: [201, 409]
  request:
    method: POST
    path: /api/transfers
    json: {to_username: zz_recipient, amount: 1000.01}
  expect: {status: 409}
  stated_in: [standard, exhaustive]
probes:
- {id: probe.transfers.csrf, cwe: cwe-352, kind: csrf_missing, endpoint: transfers.create}
- {id: probe.transfers.idor, cwe: cwe-639, kind: idor_enumeration, endpoint: transfers.get}
