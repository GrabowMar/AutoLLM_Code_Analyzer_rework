# TaskSpecContent (schema 4) without prose; prose/{minimal,standard,exhaustive}.md hold the variants.
# Edit by hand; keep the prose consistent (every endpoint as `METHOD /path` in standard and exhaustive).
title: Team projects with roles
summary: Organizations with owner, admin, member and viewer roles share projects that outsiders cannot see.
category: collaboration
entities:
- name: User
  fields:
  - {name: username, type: string, required: true, unique: true, max_length: 50}
  - {name: password, type: string, required: true, secret: true}
- name: Organization
  fields:
  - {name: name, type: string, required: true, max_length: 100}
  - {name: created_at, type: datetime}
- name: Membership
  fields:
  - {name: username, type: string, required: true, max_length: 50}
  - name: role
    type: enum
    required: true
    enum: [owner, admin, member, viewer]
- name: Project
  fields:
  - {name: name, type: string, required: true, max_length: 120}
  - {name: description, type: text, max_length: 2000}
  - name: status
    type: enum
    enum: [active, archived]
    default: active
  - {name: org_id, type: ref, ref: Organization}
  - {name: created_at, type: datetime}
endpoints:
- id: auth.register
  method: POST
  path: /api/auth/register
  auth: public
  success_status: 201
  request_schema:
    type: object
    required: [username, password]
    properties:
      username: {type: string, minLength: 1, maxLength: 50}
      password: {type: string, minLength: 1}
  errors: [400, 409]
- id: auth.login
  method: POST
  path: /api/auth/login
  auth: public
  request_schema:
    type: object
    properties:
      username: {type: string}
      password: {type: string}
    required: [username, password]
  errors: [401]
- id: orgs.create
  method: POST
  path: /api/orgs
  auth: user
  success_status: 201
  request_schema:
    type: object
    properties:
      name: {type: string, maxLength: 100, minLength: 1}
    required: [name]
  response_schema:
    type: object
    required: [id, name, role]
    properties:
      id:
        type: [integer, string]
      name: {type: string, maxLength: 100, minLength: 1}
      created_at:
        type: [string, 'null']
        format: date-time
      role: {type: string}
  errors: [400]
- id: orgs.list
  method: GET
  path: /api/orgs
  auth: user
  response_schema:
    type: object
    required: [items]
    properties:
      items:
        type: array
        items:
          type: object
          required: [id, name, role]
          properties:
            id:
              type: [integer, string]
            name: {type: string, maxLength: 100, minLength: 1}
            created_at:
              type: [string, 'null']
              format: date-time
            role: {type: string}
- id: members.list
  method: GET
  path: /api/orgs/{org_id}/members
  auth: user
  response_schema:
    type: object
    required: [items]
    properties:
      items:
        type: array
        items:
          type: object
          required: [id, username, role]
          properties:
            id:
              type: [integer, string]
            username: {type: string, maxLength: 50, minLength: 1}
            role:
              type: string
              enum: [owner, admin, member, viewer]
  errors: [404]
- id: members.add
  method: POST
  path: /api/orgs/{org_id}/members
  auth: user
  success_status: 201
  request_schema:
    type: object
    properties:
      username: {type: string, maxLength: 50, minLength: 1}
      role:
        type: string
        enum: [owner, admin, member, viewer]
    required: [username, role]
  response_schema:
    type: object
    required: [id, username, role]
    properties:
      id:
        type: [integer, string]
      username: {type: string, maxLength: 50, minLength: 1}
      role:
        type: string
        enum: [owner, admin, member, viewer]
  errors: [400, 403, 404, 409]
- id: members.update
  method: PATCH
  path: /api/orgs/{org_id}/members/{username}
  auth: user
  request_schema:
    type: object
    properties:
      role:
        type: string
        enum: [owner, admin, member, viewer]
  response_schema:
    type: object
    required: [id, username, role]
    properties:
      id:
        type: [integer, string]
      username: {type: string, maxLength: 50, minLength: 1}
      role:
        type: string
        enum: [owner, admin, member, viewer]
  errors: [400, 403, 404, 409]
- id: members.remove
  method: DELETE
  path: /api/orgs/{org_id}/members/{username}
  auth: user
  success_status: 204
  errors: [403, 404, 409]
- id: projects.list
  method: GET
  path: /api/orgs/{org_id}/projects
  auth: user
  query:
  - name: status
    type: enum
    semantics: filter
    enum: [active, archived]
  response_schema:
    type: object
    required: [items]
    properties:
      items:
        type: array
        items:
          type: object
          required: [id, name]
          properties:
            id:
              type: [integer, string]
            name: {type: string, maxLength: 120, minLength: 1}
            description:
              type: [string, 'null']
              maxLength: 2000
            status:
              type: [string, 'null']
              enum: [active, archived, null]
            org_id:
              type: [integer, 'null']
            created_at:
              type: [string, 'null']
              format: date-time
  errors: [404]
- id: projects.create
  method: POST
  path: /api/orgs/{org_id}/projects
  auth: user
  success_status: 201
  request_schema:
    type: object
    properties:
      name: {type: string, maxLength: 120, minLength: 1}
      description:
        type: [string, 'null']
        maxLength: 2000
      status:
        type: [string, 'null']
        enum: [active, archived, null]
    required: [name]
  response_schema:
    type: object
    required: [id, name]
    properties:
      id:
        type: [integer, string]
      name: {type: string, maxLength: 120, minLength: 1}
      description:
        type: [string, 'null']
        maxLength: 2000
      status:
        type: [string, 'null']
        enum: [active, archived, null]
      org_id:
        type: [integer, 'null']
      created_at:
        type: [string, 'null']
        format: date-time
  errors: [400, 403, 404]
- id: projects.get
  method: GET
  path: /api/projects/{id}
  auth: user
  response_schema:
    type: object
    required: [id, name]
    properties:
      id:
        type: [integer, string]
      name: {type: string, maxLength: 120, minLength: 1}
      description:
        type: [string, 'null']
        maxLength: 2000
      status:
        type: [string, 'null']
        enum: [active, archived, null]
      org_id:
        type: [integer, 'null']
      created_at:
        type: [string, 'null']
        format: date-time
  errors: [404]
- id: projects.update
  method: PATCH
  path: /api/projects/{id}
  auth: user
  request_schema:
    type: object
    properties:
      name: {type: string, maxLength: 120, minLength: 1}
      description:
        type: [string, 'null']
        maxLength: 2000
      status:
        type: [string, 'null']
        enum: [active, archived, null]
  response_schema:
    type: object
    required: [id, name]
    properties:
      id:
        type: [integer, string]
      name: {type: string, maxLength: 120, minLength: 1}
      description:
        type: [string, 'null']
        maxLength: 2000
      status:
        type: [string, 'null']
        enum: [active, archived, null]
      org_id:
        type: [integer, 'null']
      created_at:
        type: [string, 'null']
        format: date-time
  errors: [400, 403, 404]
- id: projects.delete
  method: DELETE
  path: /api/projects/{id}
  auth: user
  success_status: 204
  errors: [403, 404]
ui:
- id: ui.auth
  text: Registration and sign-in forms; the signed-in username and a sign-out button.
  endpoints: [auth.register, auth.login]
- id: ui.orgs
  text: An organization switcher listing the user's organizations with their role, and a 'New organization' form.
  endpoints: [orgs.list, orgs.create]
- id: ui.members
  text: A members page with roles, an 'Add member' form and role and remove controls shown only when the user's
    role allows them.
  endpoints: [members.list, members.add, members.update, members.remove]
- id: ui.projects
  text: The organization's projects with a status filter, create and edit forms and delete with confirmation, each
    control shown only when the role allows it.
  endpoints: [projects.list, projects.create, projects.update, projects.delete]
features: [auth, roles]
surfaces: [cwe-639, cwe-285, cwe-863, cwe-862, cwe-269, cwe-915, cwe-20, cwe-200]
auth_flow: {register: auth.register, login: auth.login, credential: bearer, token_json_path: token}
acceptance:
- id: projects.cross_tenant
  category: ownership
  endpoint: projects.get
  actor: user_b
  setup:
  - request:
      method: POST
      path: /api/orgs
      json: {name: zz org}
    expect_status: 201
    capture: {oid: $.id}
  - request:
      method: POST
      path: /api/orgs/{oid}/projects
      json: {name: secret}
    expect_status: 201
    capture: {pid: $.id}
  request: {method: GET, path: '/api/projects/{pid}'}
  expect: {status: 404}
  stated_in: [standard, exhaustive]
- id: members.admin_cannot_add_owner
  category: auth
  endpoint: members.add
  actor: user_b
  setup:
  - request:
      method: POST
      path: /api/orgs
      json: {name: zz own org}
    actor: user_b
    expect_status: 201
    capture: {b_oid: $.id}
  - request: {method: GET, path: '/api/orgs/{b_oid}/members'}
    actor: user_b
    expect_status: 200
    capture: {b_name: '$.items[0].username'}
  - request:
      method: POST
      path: /api/auth/register
      json: {username: zz_owner_candidate, password: s3cret-pass}
    actor: anon
    expect_status: [201, 409]
  - request:
      method: POST
      path: /api/orgs
      json: {name: zz roles org}
    actor: user_a
    expect_status: 201
    capture: {oid: $.id}
  - request:
      method: POST
      path: /api/orgs/{oid}/members
      json: {username: '{b_name}', role: admin}
    actor: user_a
    expect_status: 201
  request:
    method: POST
    path: /api/orgs/{oid}/members
    json: {username: zz_owner_candidate, role: owner}
  expect: {status: 403}
  stated_in: [standard, exhaustive]
probes:
- {id: probe.projects.idor, cwe: cwe-639, kind: idor_enumeration, endpoint: projects.get}
- id: probe.projects.mass_assignment
  cwe: cwe-915
  kind: mass_assignment
  endpoint: projects.create
  params: {field: org_id}
