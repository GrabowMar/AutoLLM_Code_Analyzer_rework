# TaskSpecContent (schema 4) without prose; prose/{minimal,standard,exhaustive}.md hold the variants.
# Edit by hand; keep the prose consistent (every endpoint as `METHOD /path` in standard and exhaustive).
title: Multi-author blog
summary: A multi-author blog where signed-in users publish tagged posts that everyone can read; the admin moderates.
category: social
entities:
- name: User
  fields:
  - {name: username, type: string, required: true, unique: true, max_length: 50}
  - {name: password, type: string, required: true, secret: true}
- name: Post
  fields:
  - {name: title, type: string, required: true, max_length: 200}
  - {name: content, type: text, required: true, max_length: 50000}
  - {name: tags, type: json, max_length: 30}
  - {name: created_at, type: datetime}
  - {name: updated_at, type: datetime}
  owned_by_user: true
endpoints:
- id: auth.register
  method: POST
  path: /api/auth/register
  auth: public
  success_status: 201
  request_schema:
    type: object
    required: [username, password]
    properties:
      username: {type: string, minLength: 1, maxLength: 50}
      password: {type: string, minLength: 1}
  errors: [400, 409]
- id: auth.login
  method: POST
  path: /api/auth/login
  auth: public
  request_schema:
    type: object
    properties:
      username: {type: string}
      password: {type: string}
    required: [username, password]
  errors: [401]
- id: posts.list
  method: GET
  path: /api/posts
  auth: public
  query:
  - {name: q, type: string, semantics: search}
  - {name: tag, type: string, semantics: filter}
  - {name: author, type: string, semantics: filter}
  - {name: page, type: int, semantics: page, default: 1}
  - {name: page_size, type: int, semantics: page_size, default: 10, max: 50}
  response_schema:
    type: object
    required: [items, total, page, page_size]
    properties:
      items:
        type: array
        items:
          type: object
          required: [id, title, content, author, excerpt]
          properties:
            id:
              type: [integer, string]
            title: {type: string, maxLength: 200, minLength: 1}
            content: {type: string, maxLength: 50000, minLength: 1}
            tags:
              type: array
              items: {type: string, maxLength: 30, minLength: 1}
              maxItems: 10
            created_at:
              type: [string, 'null']
              format: date-time
            updated_at:
              type: [string, 'null']
              format: date-time
            author: {type: string}
            excerpt: {type: string}
      total: {type: integer}
      page: {type: integer}
      page_size: {type: integer}
- id: posts.create
  method: POST
  path: /api/posts
  auth: user
  success_status: 201
  request_schema:
    type: object
    properties:
      title: {type: string, maxLength: 200, minLength: 1}
      content: {type: string, maxLength: 50000, minLength: 1}
      tags:
        type: array
        items: {type: string, maxLength: 30, minLength: 1}
        maxItems: 10
    required: [title, content]
  response_schema:
    type: object
    required: [id, title, content, author, excerpt]
    properties:
      id:
        type: [integer, string]
      title: {type: string, maxLength: 200, minLength: 1}
      content: {type: string, maxLength: 50000, minLength: 1}
      tags:
        type: array
        items: {type: string, maxLength: 30, minLength: 1}
        maxItems: 10
      created_at:
        type: [string, 'null']
        format: date-time
      updated_at:
        type: [string, 'null']
        format: date-time
      author: {type: string}
      excerpt: {type: string}
  errors: [400]
- id: posts.get
  method: GET
  path: /api/posts/{id}
  auth: public
  response_schema:
    type: object
    required: [id, title, content, author, excerpt]
    properties:
      id:
        type: [integer, string]
      title: {type: string, maxLength: 200, minLength: 1}
      content: {type: string, maxLength: 50000, minLength: 1}
      tags:
        type: array
        items: {type: string, maxLength: 30, minLength: 1}
        maxItems: 10
      created_at:
        type: [string, 'null']
        format: date-time
      updated_at:
        type: [string, 'null']
        format: date-time
      author: {type: string}
      excerpt: {type: string}
  errors: [404]
- id: posts.replace
  method: PUT
  path: /api/posts/{id}
  auth: owner
  owner_entity: Post
  request_schema:
    type: object
    properties:
      title: {type: string, maxLength: 200, minLength: 1}
      content: {type: string, maxLength: 50000, minLength: 1}
      tags:
        type: array
        items: {type: string, maxLength: 30, minLength: 1}
        maxItems: 10
    required: [title, content]
  response_schema:
    type: object
    required: [id, title, content, author, excerpt]
    properties:
      id:
        type: [integer, string]
      title: {type: string, maxLength: 200, minLength: 1}
      content: {type: string, maxLength: 50000, minLength: 1}
      tags:
        type: array
        items: {type: string, maxLength: 30, minLength: 1}
        maxItems: 10
      created_at:
        type: [string, 'null']
        format: date-time
      updated_at:
        type: [string, 'null']
        format: date-time
      author: {type: string}
      excerpt: {type: string}
  errors: [400, 403, 404]
- id: posts.delete
  method: DELETE
  path: /api/posts/{id}
  auth: owner
  owner_entity: Post
  success_status: 204
  errors: [403, 404]
- id: admin.posts.takedown
  method: POST
  path: /api/admin/posts/{id}/toggle
  auth: admin
  response_schema:
    type: object
    required: [id, title, content, author, excerpt]
    properties:
      id:
        type: [integer, string]
      title: {type: string, maxLength: 200, minLength: 1}
      content: {type: string, maxLength: 50000, minLength: 1}
      tags:
        type: array
        items: {type: string, maxLength: 30, minLength: 1}
        maxItems: 10
      created_at:
        type: [string, 'null']
        format: date-time
      updated_at:
        type: [string, 'null']
        format: date-time
      author: {type: string}
      excerpt: {type: string}
  errors: [404]
ui:
- id: ui.auth
  text: Registration and sign-in forms; the signed-in username and a sign-out button.
  endpoints: [auth.register, auth.login]
- id: ui.list
  text: A post list with title, author, date, excerpt and tags, a search box, tag and author filters and paging.
  endpoints: [posts.list]
- id: ui.read
  text: A post page that shows the content as plain text with paragraphs kept.
  endpoints: [posts.get]
- id: ui.write
  text: An editor for new and own posts with a tag input, showing the API's validation messages; delete with confirmation.
  endpoints: [posts.create, posts.replace, posts.delete]
- id: ui.admin
  text: 'For the admin: a take-down button on every post.'
  endpoints: [admin.posts.takedown]
features: [auth, ownership, admin, search, filter, pagination]
surfaces: [cwe-79, cwe-89, cwe-639, cwe-862, cwe-20, cwe-915, cwe-798]
auth_flow: {register: auth.register, login: auth.login, credential: bearer, token_json_path: token}
probes:
- id: probe.posts.xss
  cwe: cwe-79
  kind: xss_stored
  endpoint: posts.create
  params: {field: content, view_endpoint: posts.get}
- id: probe.posts.sqli
  cwe: cwe-89
  kind: sqli_boolean
  endpoint: posts.list
  params: {param: q}
- {id: probe.posts.default_admin, cwe: cwe-798, kind: default_credential}
