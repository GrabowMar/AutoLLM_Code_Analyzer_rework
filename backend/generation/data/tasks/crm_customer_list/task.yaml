# TaskSpecContent (schema 4) without prose; prose/{minimal,standard,exhaustive}.md hold the variants.
# Edit by hand; keep the prose consistent (every endpoint as `METHOD /path` in standard and exhaustive).
title: Customer directory
summary: A shared team directory of customer contacts with a log of calls, emails and meetings.
category: crm
entities:
- name: User
  fields:
  - {name: username, type: string, required: true, unique: true, max_length: 50}
  - {name: password, type: string, required: true, secret: true}
- name: Customer
  fields:
  - {name: name, type: string, required: true, max_length: 100}
  - {name: email, type: email, required: true, unique: true, max_length: 255}
  - {name: phone, type: string, max_length: 30}
  - {name: company, type: string, max_length: 100}
  - {name: notes, type: text, max_length: 2000}
  - {name: created_at, type: datetime}
- name: Interaction
  fields:
  - {name: customer_id, type: ref, ref: Customer}
  - name: kind
    type: enum
    required: true
    enum: [call, email, meeting]
  - {name: summary, type: string, required: true, max_length: 500}
  - {name: occurred_at, type: datetime}
endpoints:
- id: auth.register
  method: POST
  path: /api/auth/register
  auth: public
  success_status: 201
  request_schema:
    type: object
    required: [username, password]
    properties:
      username: {type: string, minLength: 1, maxLength: 50}
      password: {type: string, minLength: 1}
  errors: [400, 409]
- id: auth.login
  method: POST
  path: /api/auth/login
  auth: public
  request_schema:
    type: object
    properties:
      username: {type: string}
      password: {type: string}
    required: [username, password]
  errors: [401]
- id: customers.list
  method: GET
  path: /api/customers
  auth: user
  query:
  - {name: q, type: string, semantics: search}
  - {name: company, type: string, semantics: filter}
  - {name: page, type: int, semantics: page, default: 1}
  - {name: page_size, type: int, semantics: page_size, default: 20, max: 100}
  response_schema:
    type: object
    required: [items, total, page, page_size]
    properties:
      items:
        type: array
        items:
          type: object
          required: [id, name, email, interaction_count, last_contacted_at]
          properties:
            id:
              type: [integer, string]
            name: {type: string, maxLength: 100, minLength: 1}
            email: {type: string, maxLength: 255, format: email}
            phone:
              type: [string, 'null']
              maxLength: 30
            company:
              type: [string, 'null']
              maxLength: 100
            notes:
              type: [string, 'null']
              maxLength: 2000
            created_at:
              type: [string, 'null']
              format: date-time
            interaction_count: {type: integer}
            last_contacted_at: &id001 [string, 'null']
      total: {type: integer}
      page: {type: integer}
      page_size: {type: integer}
- id: customers.create
  method: POST
  path: /api/customers
  auth: user
  success_status: 201
  request_schema:
    type: object
    properties:
      name: {type: string, maxLength: 100, minLength: 1}
      email: {type: string, maxLength: 255, format: email}
      phone:
        type: [string, 'null']
        maxLength: 30
      company:
        type: [string, 'null']
        maxLength: 100
      notes:
        type: [string, 'null']
        maxLength: 2000
    required: [name, email]
  response_schema:
    type: object
    required: [id, name, email, interaction_count, last_contacted_at]
    properties:
      id:
        type: [integer, string]
      name: {type: string, maxLength: 100, minLength: 1}
      email: {type: string, maxLength: 255, format: email}
      phone:
        type: [string, 'null']
        maxLength: 30
      company:
        type: [string, 'null']
        maxLength: 100
      notes:
        type: [string, 'null']
        maxLength: 2000
      created_at:
        type: [string, 'null']
        format: date-time
      interaction_count: {type: integer}
      last_contacted_at: *id001
  errors: [400, 409]
- id: customers.get
  method: GET
  path: /api/customers/{id}
  auth: user
  response_schema:
    type: object
    required: [id, name, email, interaction_count, last_contacted_at]
    properties:
      id:
        type: [integer, string]
      name: {type: string, maxLength: 100, minLength: 1}
      email: {type: string, maxLength: 255, format: email}
      phone:
        type: [string, 'null']
        maxLength: 30
      company:
        type: [string, 'null']
        maxLength: 100
      notes:
        type: [string, 'null']
        maxLength: 2000
      created_at:
        type: [string, 'null']
        format: date-time
      interaction_count: {type: integer}
      last_contacted_at: *id001
  errors: [404]
- id: customers.replace
  method: PUT
  path: /api/customers/{id}
  auth: user
  request_schema:
    type: object
    properties:
      name: {type: string, maxLength: 100, minLength: 1}
      email: {type: string, maxLength: 255, format: email}
      phone:
        type: [string, 'null']
        maxLength: 30
      company:
        type: [string, 'null']
        maxLength: 100
      notes:
        type: [string, 'null']
        maxLength: 2000
    required: [name, email]
  response_schema:
    type: object
    required: [id, name, email, interaction_count, last_contacted_at]
    properties:
      id:
        type: [integer, string]
      name: {type: string, maxLength: 100, minLength: 1}
      email: {type: string, maxLength: 255, format: email}
      phone:
        type: [string, 'null']
        maxLength: 30
      company:
        type: [string, 'null']
        maxLength: 100
      notes:
        type: [string, 'null']
        maxLength: 2000
      created_at:
        type: [string, 'null']
        format: date-time
      interaction_count: {type: integer}
      last_contacted_at: *id001
  errors: [400, 404, 409]
- id: customers.delete
  method: DELETE
  path: /api/customers/{id}
  auth: user
  success_status: 204
  errors: [404]
- id: interactions.list
  method: GET
  path: /api/customers/{id}/interactions
  auth: user
  response_schema:
    type: object
    required: [items]
    properties:
      items:
        type: array
        items:
          type: object
          required: [id, kind, summary, logged_by]
          properties:
            id:
              type: [integer, string]
            customer_id:
              type: [integer, 'null']
            kind:
              type: string
              enum: [call, email, meeting]
            summary: {type: string, maxLength: 500, minLength: 1}
            occurred_at:
              type: [string, 'null']
              format: date-time
            logged_by: {type: string}
  errors: [404]
- id: interactions.create
  method: POST
  path: /api/customers/{id}/interactions
  auth: user
  success_status: 201
  request_schema:
    type: object
    properties:
      kind:
        type: string
        enum: [call, email, meeting]
      summary: {type: string, maxLength: 500, minLength: 1}
      occurred_at:
        type: [string, 'null']
        format: date-time
    required: [kind, summary]
  response_schema:
    type: object
    required: [id, kind, summary, logged_by]
    properties:
      id:
        type: [integer, string]
      customer_id:
        type: [integer, 'null']
      kind:
        type: string
        enum: [call, email, meeting]
      summary: {type: string, maxLength: 500, minLength: 1}
      occurred_at:
        type: [string, 'null']
        format: date-time
      logged_by: {type: string}
  errors: [400, 404]
ui:
- id: ui.auth
  text: A sign-in screen with a short description of the directory, and a registration form.
  endpoints: [auth.register, auth.login]
- id: ui.list
  text: A customer table with name, email, phone, company and last contacted date, a search box, a company filter
    and paging.
  endpoints: [customers.list]
- id: ui.detail
  text: A customer page with edit and delete actions, the interaction log (kind, summary, date, who logged it) and
    a form to log a new one.
  endpoints: [customers.get, customers.replace, customers.delete, interactions.list, interactions.create]
- id: ui.forms
  text: Add and edit forms that show the API's validation messages, including the duplicate-email message.
  endpoints: [customers.create, customers.replace]
features: [auth, search, filter, pagination]
surfaces: [cwe-862, cwe-89, cwe-79, cwe-20, cwe-200]
auth_flow: {register: auth.register, login: auth.login, credential: bearer, token_json_path: token}
probes:
- id: probe.customers.sqli
  cwe: cwe-89
  kind: sqli_boolean
  endpoint: customers.list
  params: {param: q}
- id: probe.customers.xss
  cwe: cwe-79
  kind: xss_stored
  endpoint: customers.create
  params: {field: notes, view_endpoint: customers.get}
