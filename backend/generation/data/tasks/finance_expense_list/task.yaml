# TaskSpecContent (schema 4) without prose; prose/{minimal,standard,exhaustive}.md hold the variants.
# Edit by hand; keep the prose consistent (every endpoint as `METHOD /path` in standard and exhaustive).
title: Expense tracker
summary: Record personal expenses and see where the money goes by category and period.
category: finance
entities:
- name: User
  fields:
  - {name: username, type: string, required: true, unique: true, max_length: 50}
  - {name: password, type: string, required: true, secret: true}
- name: Expense
  fields:
  - {name: amount, type: float, required: true, min: 0.01, max: 1000000}
  - name: category
    type: enum
    required: true
    enum: [food, transport, housing, utilities, entertainment, health, other]
  - {name: description, type: string, max_length: 500}
  - {name: date, type: date, required: true}
  - {name: created_at, type: datetime}
  owned_by_user: true
endpoints:
- id: auth.register
  method: POST
  path: /api/auth/register
  auth: public
  success_status: 201
  request_schema:
    type: object
    required: [username, password]
    properties:
      username: {type: string, minLength: 1, maxLength: 50}
      password: {type: string, minLength: 1}
  errors: [400, 409]
- id: auth.login
  method: POST
  path: /api/auth/login
  auth: public
  request_schema:
    type: object
    properties:
      username: {type: string}
      password: {type: string}
    required: [username, password]
  errors: [401]
- id: expenses.list
  method: GET
  path: /api/expenses
  auth: user
  query:
  - name: category
    type: enum
    semantics: filter
    enum: [food, transport, housing, utilities, entertainment, health, other]
  - {name: start_date, type: date, semantics: filter}
  - {name: end_date, type: date, semantics: filter}
  - {name: page, type: int, semantics: page, default: 1}
  - {name: page_size, type: int, semantics: page_size, default: 25, max: 100}
  response_schema:
    type: object
    required: [items, total, page, page_size, total_amount]
    properties:
      items:
        type: array
        items:
          type: object
          required: [id, amount, category, date]
          properties:
            id:
              type: [integer, string]
            amount: {type: number, minimum: 0.01, maximum: 1000000}
            category:
              type: string
              enum: [food, transport, housing, utilities, entertainment, health, other]
            description:
              type: [string, 'null']
              maxLength: 500
            date: {type: string, format: date}
            created_at:
              type: [string, 'null']
              format: date-time
      total: {type: integer}
      page: {type: integer}
      page_size: {type: integer}
      total_amount: {type: number}
  errors: [400]
- id: expenses.create
  method: POST
  path: /api/expenses
  auth: user
  success_status: 201
  request_schema:
    type: object
    properties:
      amount: {type: number, minimum: 0.01, maximum: 1000000}
      category:
        type: string
        enum: [food, transport, housing, utilities, entertainment, health, other]
      description:
        type: [string, 'null']
        maxLength: 500
      date: {type: string, format: date}
    required: [amount, category, date]
  response_schema:
    type: object
    required: [id, amount, category, date]
    properties:
      id:
        type: [integer, string]
      amount: {type: number, minimum: 0.01, maximum: 1000000}
      category:
        type: string
        enum: [food, transport, housing, utilities, entertainment, health, other]
      description:
        type: [string, 'null']
        maxLength: 500
      date: {type: string, format: date}
      created_at:
        type: [string, 'null']
        format: date-time
  errors: [400]
- id: expenses.summary
  method: GET
  path: /api/expenses/summary
  auth: user
  query:
  - name: category
    type: enum
    semantics: filter
    enum: [food, transport, housing, utilities, entertainment, health, other]
  - {name: start_date, type: date, semantics: filter}
  - {name: end_date, type: date, semantics: filter}
  response_schema:
    type: object
    properties:
      total_amount: {type: number}
      count: {type: integer}
      by_category: {type: object}
    required: [total_amount, count, by_category]
  errors: [400]
- id: expenses.get
  method: GET
  path: /api/expenses/{id}
  auth: owner
  owner_entity: Expense
  response_schema:
    type: object
    required: [id, amount, category, date]
    properties:
      id:
        type: [integer, string]
      amount: {type: number, minimum: 0.01, maximum: 1000000}
      category:
        type: string
        enum: [food, transport, housing, utilities, entertainment, health, other]
      description:
        type: [string, 'null']
        maxLength: 500
      date: {type: string, format: date}
      created_at:
        type: [string, 'null']
        format: date-time
  errors: [404]
- id: expenses.replace
  method: PUT
  path: /api/expenses/{id}
  auth: owner
  owner_entity: Expense
  request_schema:
    type: object
    properties:
      amount: {type: number, minimum: 0.01, maximum: 1000000}
      category:
        type: string
        enum: [food, transport, housing, utilities, entertainment, health, other]
      description:
        type: [string, 'null']
        maxLength: 500
      date: {type: string, format: date}
    required: [amount, category, date]
  response_schema:
    type: object
    required: [id, amount, category, date]
    properties:
      id:
        type: [integer, string]
      amount: {type: number, minimum: 0.01, maximum: 1000000}
      category:
        type: string
        enum: [food, transport, housing, utilities, entertainment, health, other]
      description:
        type: [string, 'null']
        maxLength: 500
      date: {type: string, format: date}
      created_at:
        type: [string, 'null']
        format: date-time
  errors: [400, 404]
- id: expenses.delete
  method: DELETE
  path: /api/expenses/{id}
  auth: owner
  owner_entity: Expense
  success_status: 204
  errors: [404]
ui:
- id: ui.auth
  text: Registration and sign-in forms; the signed-in username and a sign-out button.
  endpoints: [auth.register, auth.login]
- id: ui.summary
  text: A total card and a per-category breakdown with amounts and shares for the current filters.
  endpoints: [expenses.summary]
- id: ui.list
  text: The expense list with a category filter, a period filter ('This month', 'Last month', custom dates) and
    paging.
  endpoints: [expenses.list]
- id: ui.forms
  text: Add and edit forms (date defaulting to today) showing the API's validation messages; delete asks for confirmation.
  endpoints: [expenses.create, expenses.replace, expenses.delete]
features: [auth, ownership, filter, pagination, money]
surfaces: [cwe-639, cwe-862, cwe-89, cwe-20, cwe-79, cwe-915]
auth_flow: {register: auth.register, login: auth.login, credential: bearer, token_json_path: token}
acceptance:
- id: expenses.summary.categories
  category: functional
  endpoint: expenses.summary
  setup:
  - request:
      method: POST
      path: /api/expenses
      json: {amount: 12.5, category: food, date: '2026-01-05'}
    expect_status: 201
  request: {method: GET, path: /api/expenses/summary}
  expect:
    status: 200
    json_contains:
      by_category: {food: 12.5, transport: 0}
  stated_in: [exhaustive]
probes:
- {id: probe.expenses.idor, cwe: cwe-639, kind: idor_enumeration, endpoint: expenses.get}
- id: probe.expenses.sqli
  cwe: cwe-89
  kind: sqli_boolean
  endpoint: expenses.list
  params: {param: category}
