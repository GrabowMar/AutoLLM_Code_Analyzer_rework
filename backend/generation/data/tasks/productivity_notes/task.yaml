# TaskSpecContent (schema 4) without prose; prose/{minimal,standard,exhaustive}.md hold the variants.
# Edit by hand; keep the prose consistent (every endpoint as `METHOD /path` in standard and exhaustive).
title: Tagged notes
summary: Write public notes, tag them and find them again by tag, author or text.
category: productivity
entities:
- name: User
  fields:
  - {name: username, type: string, required: true, unique: true, max_length: 50}
  - {name: password, type: string, required: true, secret: true}
- name: Note
  fields:
  - {name: title, type: string, required: true, max_length: 200}
  - {name: content, type: text, max_length: 20000}
  - {name: tags, type: json, max_length: 30}
  - {name: pinned, type: bool, default: false}
  - {name: created_at, type: datetime}
  - {name: updated_at, type: datetime}
  owned_by_user: true
endpoints:
- id: auth.register
  method: POST
  path: /api/auth/register
  auth: public
  success_status: 201
  request_schema:
    type: object
    required: [username, password]
    properties:
      username: {type: string, minLength: 1, maxLength: 50}
      password: {type: string, minLength: 1}
  errors: [400, 409]
- id: auth.login
  method: POST
  path: /api/auth/login
  auth: public
  request_schema:
    type: object
    properties:
      username: {type: string}
      password: {type: string}
    required: [username, password]
  errors: [401]
- id: notes.list
  method: GET
  path: /api/notes
  auth: public
  query:
  - {name: tag, type: string, semantics: filter}
  - {name: author, type: string, semantics: filter}
  - {name: q, type: string, semantics: search}
  - {name: page, type: int, semantics: page, default: 1}
  - {name: page_size, type: int, semantics: page_size, default: 20, max: 100}
  response_schema:
    type: object
    required: [items, total, page, page_size]
    properties:
      items:
        type: array
        items:
          type: object
          required: [id, title, author]
          properties:
            id:
              type: [integer, string]
            title: {type: string, maxLength: 200, minLength: 1}
            content:
              type: [string, 'null']
              maxLength: 20000
            tags:
              type: array
              items: {type: string, maxLength: 30, minLength: 1}
              maxItems: 10
            pinned:
              type: [boolean, 'null']
            created_at:
              type: [string, 'null']
              format: date-time
            updated_at:
              type: [string, 'null']
              format: date-time
            author: {type: string}
      total: {type: integer}
      page: {type: integer}
      page_size: {type: integer}
- id: notes.create
  method: POST
  path: /api/notes
  auth: user
  success_status: 201
  request_schema:
    type: object
    properties:
      title: {type: string, maxLength: 200, minLength: 1}
      content:
        type: [string, 'null']
        maxLength: 20000
      tags:
        type: array
        items: {type: string, maxLength: 30, minLength: 1}
        maxItems: 10
      pinned:
        type: [boolean, 'null']
    required: [title]
  response_schema:
    type: object
    required: [id, title, author]
    properties:
      id:
        type: [integer, string]
      title: {type: string, maxLength: 200, minLength: 1}
      content:
        type: [string, 'null']
        maxLength: 20000
      tags:
        type: array
        items: {type: string, maxLength: 30, minLength: 1}
        maxItems: 10
      pinned:
        type: [boolean, 'null']
      created_at:
        type: [string, 'null']
        format: date-time
      updated_at:
        type: [string, 'null']
        format: date-time
      author: {type: string}
  errors: [400]
- id: notes.get
  method: GET
  path: /api/notes/{id}
  auth: public
  response_schema:
    type: object
    required: [id, title, author]
    properties:
      id:
        type: [integer, string]
      title: {type: string, maxLength: 200, minLength: 1}
      content:
        type: [string, 'null']
        maxLength: 20000
      tags:
        type: array
        items: {type: string, maxLength: 30, minLength: 1}
        maxItems: 10
      pinned:
        type: [boolean, 'null']
      created_at:
        type: [string, 'null']
        format: date-time
      updated_at:
        type: [string, 'null']
        format: date-time
      author: {type: string}
  errors: [404]
- id: notes.update
  method: PATCH
  path: /api/notes/{id}
  auth: owner
  owner_entity: Note
  request_schema:
    type: object
    properties:
      title: {type: string, maxLength: 200, minLength: 1}
      content:
        type: [string, 'null']
        maxLength: 20000
      tags:
        type: array
        items: {type: string, maxLength: 30, minLength: 1}
        maxItems: 10
      pinned:
        type: [boolean, 'null']
  response_schema:
    type: object
    required: [id, title, author]
    properties:
      id:
        type: [integer, string]
      title: {type: string, maxLength: 200, minLength: 1}
      content:
        type: [string, 'null']
        maxLength: 20000
      tags:
        type: array
        items: {type: string, maxLength: 30, minLength: 1}
        maxItems: 10
      pinned:
        type: [boolean, 'null']
      created_at:
        type: [string, 'null']
        format: date-time
      updated_at:
        type: [string, 'null']
        format: date-time
      author: {type: string}
  errors: [400, 403, 404]
- id: notes.delete
  method: DELETE
  path: /api/notes/{id}
  auth: owner
  owner_entity: Note
  success_status: 204
  errors: [403, 404]
- id: tags.list
  method: GET
  path: /api/tags
  auth: public
  response_schema:
    type: object
    required: [items]
    properties:
      items:
        type: array
        items:
          type: object
          properties:
            tag: {type: string}
            count: {type: integer}
          required: [tag, count]
ui:
- id: ui.auth
  text: Registration and sign-in forms; the signed-in username and a sign-out button.
  endpoints: [auth.register, auth.login]
- id: ui.list
  text: A note list (pinned ones marked) with a search box, an author filter, paging and a tag cloud whose tags
    filter the list.
  endpoints: [notes.list, tags.list]
- id: ui.detail
  text: A note page that shows the content as plain text with line breaks kept.
  endpoints: [notes.get]
- id: ui.edit
  text: Create and edit forms with a tag input, showing the API's validation messages; delete with confirmation
    on the user's own notes.
  endpoints: [notes.create, notes.update, notes.delete]
features: [auth, ownership, search, filter, pagination]
surfaces: [cwe-79, cwe-89, cwe-639, cwe-862, cwe-20, cwe-915]
auth_flow: {register: auth.register, login: auth.login, credential: bearer, token_json_path: token}
acceptance:
- id: notes.tags.normalized
  category: functional
  endpoint: notes.create
  request:
    method: POST
    path: /api/notes
    json:
      title: t
      tags: [' Work ', work, Home]
  expect:
    status: 201
    json_contains:
      tags: [work, home]
  stated_in: [exhaustive]
probes:
- id: probe.notes.xss
  cwe: cwe-79
  kind: xss_stored
  endpoint: notes.create
  params: {field: content, view_endpoint: notes.get}
- id: probe.notes.sqli
  cwe: cwe-89
  kind: sqli_boolean
  endpoint: notes.list
  params: {param: q}
