# TaskSpecContent (schema 4) without prose; prose/{minimal,standard,exhaustive}.md hold the variants.
# Edit by hand; keep the prose consistent (every endpoint as `METHOD /path` in standard and exhaustive).
title: Account sign-in
summary: Register accounts, sign in, view and edit the profile; an admin manages accounts.
category: authentication
entities:
- name: User
  fields:
  - {name: username, type: string, required: true, unique: true, max_length: 50}
  - {name: password, type: string, required: true, secret: true}
  - {name: email, type: email, max_length: 254}
  - {name: display_name, type: string, max_length: 50}
  - {name: is_admin, type: bool, default: false}
  - {name: is_active, type: bool, default: true}
  - {name: created_at, type: datetime}
endpoints:
- id: auth.register
  method: POST
  path: /api/auth/register
  auth: public
  success_status: 201
  request_schema:
    type: object
    required: [username, password]
    properties:
      username: {type: string, minLength: 1, maxLength: 50}
      password: {type: string, minLength: 8}
      email:
        type: [string, 'null']
        format: email
        maxLength: 254
      display_name:
        type: [string, 'null']
        maxLength: 50
  errors: [400, 409]
- id: auth.login
  method: POST
  path: /api/auth/login
  auth: public
  request_schema:
    type: object
    properties:
      username: {type: string}
      password: {type: string}
    required: [username, password]
  errors: [401]
- id: me.get
  method: GET
  path: /api/me
  auth: user
  response_schema:
    type: object
    properties:
      id: [integer, string]
      username: {type: string}
      email: [string, 'null']
      display_name: [string, 'null']
      is_admin: {type: boolean}
      created_at: {type: string}
    required: [id, username, is_admin]
- id: me.update
  method: PATCH
  path: /api/me
  auth: user
  request_schema:
    type: object
    properties:
      email:
        type: [string, 'null']
        format: email
        maxLength: 254
      display_name:
        type: [string, 'null']
        maxLength: 50
  errors: [400]
- id: me.password
  method: POST
  path: /api/me/password
  auth: user
  success_status: 204
  request_schema:
    type: object
    properties:
      current_password: {type: string}
      new_password: {type: string, minLength: 8, maxLength: 128}
    required: [current_password, new_password]
  errors: [400, 403]
- id: admin.users
  method: GET
  path: /api/admin/users
  auth: admin
  query:
  - {name: page, type: int, semantics: page, default: 1}
  - {name: page_size, type: int, semantics: page_size, default: 20, max: 100}
  response_schema:
    type: object
    required: [items, total, page, page_size]
    properties:
      items:
        type: array
        items:
          type: object
          properties:
            id: [integer, string]
            username: {type: string}
            is_active: {type: boolean}
          required: [id, username, is_active]
      total: {type: integer}
      page: {type: integer}
      page_size: {type: integer}
- id: admin.users.toggle
  method: POST
  path: /api/admin/users/{id}/toggle
  auth: admin
  errors: [400, 404]
ui:
- id: ui.auth
  text: A card with 'Sign in' and 'Register' tabs; registration checks required fields and the 8-character minimum
    before sending and shows the API's messages.
  endpoints: [auth.register, auth.login]
- id: ui.profile
  text: 'After sign-in: a profile panel with username, email, display name and member-since date, an edit form and
    a change-password form.'
  endpoints: [me.get, me.update, me.password]
- id: ui.expired
  text: When a request answers 401, the app returns to the sign-in card with a 'Please sign in again' message.
  endpoints: [me.get]
- id: ui.admin
  text: 'For the admin: the account list with a deactivate/reactivate button per row, disabled on the admin''s own
    row.'
  endpoints: [admin.users, admin.users.toggle]
features: [auth, admin]
surfaces: [cwe-287, cwe-521, cwe-256, cwe-916, cwe-307, cwe-613, cwe-204, cwe-798, cwe-862, cwe-915, cwe-347]
auth_flow: {register: auth.register, login: auth.login, credential: bearer, token_json_path: token}
probes:
- {id: probe.auth.plaintext_password, cwe: cwe-256, kind: plaintext_password_db}
- {id: probe.auth.default_admin, cwe: cwe-798, kind: default_credential}
- id: probe.auth.mass_assignment
  cwe: cwe-915
  kind: mass_assignment
  endpoint: me.update
  params: {field: is_admin}
- {id: probe.auth.jwt_none, cwe: cwe-347, kind: jwt_none_alg}
