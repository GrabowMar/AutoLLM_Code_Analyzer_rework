# TaskSpecContent (schema 4) without prose; prose/{minimal,standard,exhaustive}.md hold the variants.
# Edit by hand; keep the prose consistent (every endpoint as `METHOD /path` in standard and exhaustive).
title: Image gallery
summary: Upload PNG and JPEG images to a shared public gallery and view them full size.
category: file-processing
entities:
- name: User
  fields:
  - {name: username, type: string, required: true, unique: true, max_length: 50}
  - {name: password, type: string, required: true, secret: true}
- name: Image
  fields:
  - {name: filename, type: string, required: true, max_length: 255}
  - {name: title, type: string, max_length: 100}
  - {name: data, type: string, required: true}
  - name: content_type
    type: enum
    enum: [image/png, image/jpeg]
  - {name: size_bytes, type: int}
  - {name: uploaded_at, type: datetime}
  owned_by_user: true
endpoints:
- id: auth.register
  method: POST
  path: /api/auth/register
  auth: public
  success_status: 201
  request_schema:
    type: object
    required: [username, password]
    properties:
      username: {type: string, minLength: 1, maxLength: 50}
      password: {type: string, minLength: 1}
  errors: [400, 409]
- id: auth.login
  method: POST
  path: /api/auth/login
  auth: public
  request_schema:
    type: object
    properties:
      username: {type: string}
      password: {type: string}
    required: [username, password]
  errors: [401]
- id: images.list
  method: GET
  path: /api/images
  auth: public
  query:
  - {name: page, type: int, semantics: page, default: 1}
  - {name: page_size, type: int, semantics: page_size, default: 24, max: 100}
  response_schema:
    type: object
    required: [items, total, page, page_size]
    properties:
      items:
        type: array
        items:
          type: object
          required: [id, filename, url, uploader]
          properties:
            id:
              type: [integer, string]
            filename: {type: string, maxLength: 255, minLength: 1}
            title:
              type: [string, 'null']
              maxLength: 100
            content_type:
              type: [string, 'null']
              enum: [image/png, image/jpeg, null]
            size_bytes:
              type: [integer, 'null']
            uploaded_at:
              type: [string, 'null']
              format: date-time
            url: {type: string}
            uploader: {type: string}
      total: {type: integer}
      page: {type: integer}
      page_size: {type: integer}
- id: images.upload
  method: POST
  path: /api/images
  auth: user
  success_status: 201
  request_schema:
    type: object
    properties:
      filename: {type: string, maxLength: 255, minLength: 1}
      title:
        type: [string, 'null']
        maxLength: 100
      data: {type: string, minLength: 1}
    required: [filename, data]
  response_schema:
    type: object
    required: [id, filename, url, uploader]
    properties:
      id:
        type: [integer, string]
      filename: {type: string, maxLength: 255, minLength: 1}
      title:
        type: [string, 'null']
        maxLength: 100
      content_type:
        type: [string, 'null']
        enum: [image/png, image/jpeg, null]
      size_bytes:
        type: [integer, 'null']
      uploaded_at:
        type: [string, 'null']
        format: date-time
      url: {type: string}
      uploader: {type: string}
  errors: [400, 413]
  tags: [upload]
- id: images.get
  method: GET
  path: /api/images/{id}
  auth: public
  response_schema:
    type: object
    required: [id, filename, url, uploader]
    properties:
      id:
        type: [integer, string]
      filename: {type: string, maxLength: 255, minLength: 1}
      title:
        type: [string, 'null']
        maxLength: 100
      content_type:
        type: [string, 'null']
        enum: [image/png, image/jpeg, null]
      size_bytes:
        type: [integer, 'null']
      uploaded_at:
        type: [string, 'null']
        format: date-time
      url: {type: string}
      uploader: {type: string}
  errors: [404]
- id: images.file
  method: GET
  path: /api/images/{id}/file
  auth: public
  content_type: none
  errors: [404]
  tags: [download]
- id: images.delete
  method: DELETE
  path: /api/images/{id}
  auth: owner
  owner_entity: Image
  success_status: 204
  errors: [403, 404]
ui:
- id: ui.auth
  text: Registration and sign-in forms; the signed-in username and a sign-out button.
  endpoints: [auth.register, auth.login]
- id: ui.gallery
  text: A responsive grid of thumbnails with title (or filename), uploader and date, paging and an empty state.
  endpoints: [images.list, images.file]
- id: ui.view
  text: Clicking a thumbnail opens the image full size with filename, title and size.
  endpoints: [images.get, images.file]
- id: ui.upload
  text: An upload form limited to PNG and JPEG with a preview and the API's error message; a delete button with
    confirmation on the user's own images.
  endpoints: [images.upload, images.delete]
features: [auth, ownership, upload-base64, download, pagination]
surfaces: [cwe-434, cwe-400, cwe-20, cwe-639, cwe-862, cwe-79, cwe-22]
auth_flow: {register: auth.register, login: auth.login, credential: bearer, token_json_path: token}
probes:
- {id: probe.images.idor, cwe: cwe-639, kind: idor_enumeration, endpoint: images.delete}
