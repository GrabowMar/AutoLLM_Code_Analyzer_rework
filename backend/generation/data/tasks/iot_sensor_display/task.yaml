# TaskSpecContent (schema 4) without prose; prose/{minimal,standard,exhaustive}.md hold the variants.
# Edit by hand; keep the prose consistent (every endpoint as `METHOD /path` in standard and exhaustive).
title: Sensor dashboard
summary: Register sensors, record their readings and watch the latest values and recent history.
category: iot
entities:
- name: User
  fields:
  - {name: username, type: string, required: true, unique: true, max_length: 50}
  - {name: password, type: string, required: true, secret: true}
- name: Sensor
  fields:
  - {name: name, type: string, required: true, max_length: 100}
  - {name: unit, type: string, required: true, max_length: 20}
  - {name: location, type: string, max_length: 100}
  - {name: last_value, type: float}
  - {name: last_updated, type: datetime}
  owned_by_user: true
- name: Reading
  fields:
  - {name: sensor_id, type: ref, ref: Sensor}
  - {name: value, type: float, required: true}
  - {name: recorded_at, type: datetime}
endpoints:
- id: auth.register
  method: POST
  path: /api/auth/register
  auth: public
  success_status: 201
  request_schema:
    type: object
    required: [username, password]
    properties:
      username: {type: string, minLength: 1, maxLength: 50}
      password: {type: string, minLength: 1}
  errors: [400, 409]
- id: auth.login
  method: POST
  path: /api/auth/login
  auth: public
  request_schema:
    type: object
    properties:
      username: {type: string}
      password: {type: string}
    required: [username, password]
  errors: [401]
- id: sensors.list
  method: GET
  path: /api/sensors
  auth: public
  response_schema:
    type: object
    required: [items]
    properties:
      items:
        type: array
        items:
          type: object
          required: [id, name, unit, owner]
          properties:
            id:
              type: [integer, string]
            name: {type: string, maxLength: 100, minLength: 1}
            unit: {type: string, maxLength: 20, minLength: 1}
            location:
              type: [string, 'null']
              maxLength: 100
            last_value:
              type: [number, 'null']
            last_updated:
              type: [string, 'null']
              format: date-time
            owner: {type: string}
- id: sensors.create
  method: POST
  path: /api/sensors
  auth: user
  success_status: 201
  request_schema:
    type: object
    properties:
      name: {type: string, maxLength: 100, minLength: 1}
      unit: {type: string, maxLength: 20, minLength: 1}
      location:
        type: [string, 'null']
        maxLength: 100
    required: [name, unit]
  response_schema:
    type: object
    required: [id, name, unit, owner]
    properties:
      id:
        type: [integer, string]
      name: {type: string, maxLength: 100, minLength: 1}
      unit: {type: string, maxLength: 20, minLength: 1}
      location:
        type: [string, 'null']
        maxLength: 100
      last_value:
        type: [number, 'null']
      last_updated:
        type: [string, 'null']
        format: date-time
      owner: {type: string}
  errors: [400]
- id: sensors.get
  method: GET
  path: /api/sensors/{id}
  auth: public
  response_schema:
    type: object
    required: [id, name, unit, owner]
    properties:
      id:
        type: [integer, string]
      name: {type: string, maxLength: 100, minLength: 1}
      unit: {type: string, maxLength: 20, minLength: 1}
      location:
        type: [string, 'null']
        maxLength: 100
      last_value:
        type: [number, 'null']
      last_updated:
        type: [string, 'null']
        format: date-time
      owner: {type: string}
  errors: [404]
- id: sensors.delete
  method: DELETE
  path: /api/sensors/{id}
  auth: owner
  owner_entity: Sensor
  success_status: 204
  errors: [403, 404]
- id: readings.list
  method: GET
  path: /api/sensors/{id}/readings
  auth: public
  query:
  - {name: limit, type: int, semantics: page_size, default: 50, max: 500}
  response_schema:
    type: object
    required: [items, total]
    properties:
      items:
        type: array
        items:
          type: object
          required: [id, value]
          properties:
            id:
              type: [integer, string]
            sensor_id:
              type: [integer, 'null']
            value: {type: number}
            recorded_at:
              type: [string, 'null']
              format: date-time
      total: {type: integer}
  errors: [404]
- id: readings.create
  method: POST
  path: /api/sensors/{id}/readings
  auth: owner
  owner_entity: Sensor
  success_status: 201
  request_schema:
    type: object
    properties:
      value: {type: number}
    required: [value]
  response_schema:
    type: object
    required: [id, value]
    properties:
      id:
        type: [integer, string]
      sensor_id:
        type: [integer, 'null']
      value: {type: number}
      recorded_at:
        type: [string, 'null']
        format: date-time
  errors: [400, 403, 404]
ui:
- id: ui.auth
  text: Registration and sign-in forms; the signed-in username and a sign-out button.
  endpoints: [auth.register, auth.login]
- id: ui.cards
  text: A card per sensor with its latest value, unit, location and how long ago it was updated; the page refreshes
    every 10 seconds.
  endpoints: [sensors.list]
- id: ui.detail
  text: A sensor page with a line chart of its recent readings and the readings as a table.
  endpoints: [sensors.get, readings.list]
- id: ui.manage
  text: 'For signed-in users: a form to register a sensor, a form to post a reading to their own sensors and delete
    with confirmation.'
  endpoints: [sensors.create, readings.create, sensors.delete]
features: [auth, ownership, realtime]
surfaces: [cwe-639, cwe-862, cwe-20, cwe-400, cwe-770, cwe-79]
auth_flow: {register: auth.register, login: auth.login, credential: bearer, token_json_path: token}
acceptance:
- id: readings.updates_last_value
  category: functional
  endpoint: sensors.get
  setup:
  - request:
      method: POST
      path: /api/sensors
      json: {name: Lab, unit: C}
    expect_status: 201
    capture: {sid: $.id}
  - request:
      method: POST
      path: /api/sensors/{sid}/readings
      json: {value: 21.5}
    expect_status: 201
  request: {method: GET, path: '/api/sensors/{sid}'}
  expect:
    status: 200
    json_contains: {last_value: 21.5}
  stated_in: [standard, exhaustive]
probes:
- {id: probe.sensors.idor, cwe: cwe-639, kind: idor_enumeration, endpoint: readings.create}
- id: probe.sensors.xss
  cwe: cwe-79
  kind: xss_stored
  endpoint: sensors.create
  params: {field: name, view_endpoint: sensors.list}
