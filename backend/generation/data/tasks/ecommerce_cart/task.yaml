# TaskSpecContent (schema 4) without prose; prose/{minimal,standard,exhaustive}.md hold the variants.
# Edit by hand; keep the prose consistent (every endpoint as `METHOD /path` in standard and exhaustive).
title: Shop with cart
summary: Browse a product catalogue and keep a personal shopping cart with live totals; the admin manages products.
category: commerce
entities:
- name: User
  fields:
  - {name: username, type: string, required: true, unique: true, max_length: 50}
  - {name: password, type: string, required: true, secret: true}
- name: Product
  fields:
  - {name: name, type: string, required: true, max_length: 120}
  - {name: description, type: text, max_length: 1000}
  - {name: price, type: float, required: true, min: 0.01}
  - {name: stock, type: int, required: true, min: 0}
  - {name: is_active, type: bool, default: true}
- name: CartItem
  fields:
  - {name: product_id, type: ref, required: true, ref: Product}
  - {name: quantity, type: int, required: true, min: 1}
  owned_by_user: true
endpoints:
- id: auth.register
  method: POST
  path: /api/auth/register
  auth: public
  success_status: 201
  request_schema:
    type: object
    required: [username, password]
    properties:
      username: {type: string, minLength: 1, maxLength: 50}
      password: {type: string, minLength: 1}
  errors: [400, 409]
- id: auth.login
  method: POST
  path: /api/auth/login
  auth: public
  request_schema:
    type: object
    properties:
      username: {type: string}
      password: {type: string}
    required: [username, password]
  errors: [401]
- id: products.list
  method: GET
  path: /api/products
  auth: public
  query:
  - {name: q, type: string, semantics: search}
  - {name: page, type: int, semantics: page, default: 1}
  - {name: page_size, type: int, semantics: page_size, default: 20, max: 100}
  response_schema:
    type: object
    required: [items, total, page, page_size]
    properties:
      items:
        type: array
        items:
          type: object
          required: [id, name, price, stock]
          properties:
            id:
              type: [integer, string]
            name: {type: string, maxLength: 120, minLength: 1}
            description:
              type: [string, 'null']
              maxLength: 1000
            price: {type: number, minimum: 0.01}
            stock: {type: integer, minimum: 0}
            is_active:
              type: [boolean, 'null']
      total: {type: integer}
      page: {type: integer}
      page_size: {type: integer}
- id: products.get
  method: GET
  path: /api/products/{id}
  auth: public
  response_schema:
    type: object
    required: [id, name, price, stock]
    properties:
      id:
        type: [integer, string]
      name: {type: string, maxLength: 120, minLength: 1}
      description:
        type: [string, 'null']
        maxLength: 1000
      price: {type: number, minimum: 0.01}
      stock: {type: integer, minimum: 0}
      is_active:
        type: [boolean, 'null']
  errors: [404]
- id: cart.get
  method: GET
  path: /api/cart
  auth: user
  response_schema:
    type: object
    required: [items, subtotal]
    properties:
      items:
        type: array
        items:
          type: object
          required: [id, product_id, quantity, name, unit_price, line_total]
          properties:
            id:
              type: [integer, string]
            product_id: {type: integer}
            quantity: {type: integer, minimum: 1}
            name: {type: string}
            unit_price: {type: number}
            line_total: {type: number}
      subtotal: {type: number}
- id: cart.add
  method: POST
  path: /api/cart
  auth: user
  success_status: 201
  request_schema:
    type: object
    properties:
      product_id: {type: integer}
      quantity: {type: integer, minimum: 1}
    required: [product_id, quantity]
  response_schema:
    type: object
    required: [id, product_id, quantity, name, unit_price, line_total]
    properties:
      id:
        type: [integer, string]
      product_id: {type: integer}
      quantity: {type: integer, minimum: 1}
      name: {type: string}
      unit_price: {type: number}
      line_total: {type: number}
  errors: [400, 404, 409]
- id: cart.update
  method: PATCH
  path: /api/cart/{id}
  auth: owner
  owner_entity: CartItem
  request_schema:
    type: object
    properties:
      quantity: {type: integer, minimum: 1}
  response_schema:
    type: object
    required: [id, product_id, quantity, name, unit_price, line_total]
    properties:
      id:
        type: [integer, string]
      product_id: {type: integer}
      quantity: {type: integer, minimum: 1}
      name: {type: string}
      unit_price: {type: number}
      line_total: {type: number}
  errors: [400, 404, 409]
- id: cart.remove
  method: DELETE
  path: /api/cart/{id}
  auth: owner
  owner_entity: CartItem
  success_status: 204
  errors: [404]
- id: admin.products.create
  method: POST
  path: /api/admin/products
  auth: admin
  success_status: 201
  request_schema:
    type: object
    properties:
      name: {type: string, maxLength: 120, minLength: 1}
      description:
        type: [string, 'null']
        maxLength: 1000
      price: {type: number, minimum: 0.01}
      stock: {type: integer, minimum: 0}
      is_active:
        type: [boolean, 'null']
    required: [name, price, stock]
  response_schema:
    type: object
    required: [id, name, price, stock]
    properties:
      id:
        type: [integer, string]
      name: {type: string, maxLength: 120, minLength: 1}
      description:
        type: [string, 'null']
        maxLength: 1000
      price: {type: number, minimum: 0.01}
      stock: {type: integer, minimum: 0}
      is_active:
        type: [boolean, 'null']
  errors: [400]
- id: admin.products.update
  method: PATCH
  path: /api/admin/products/{id}
  auth: admin
  request_schema:
    type: object
    properties:
      name: {type: string, maxLength: 120, minLength: 1}
      description:
        type: [string, 'null']
        maxLength: 1000
      price: {type: number, minimum: 0.01}
      stock: {type: integer, minimum: 0}
      is_active:
        type: [boolean, 'null']
  response_schema:
    type: object
    required: [id, name, price, stock]
    properties:
      id:
        type: [integer, string]
      name: {type: string, maxLength: 120, minLength: 1}
      description:
        type: [string, 'null']
        maxLength: 1000
      price: {type: number, minimum: 0.01}
      stock: {type: integer, minimum: 0}
      is_active:
        type: [boolean, 'null']
  errors: [400, 404]
ui:
- id: ui.auth
  text: Registration and sign-in forms; the signed-in username and a sign-out button.
  endpoints: [auth.register, auth.login]
- id: ui.grid
  text: A product grid with name, price, a placeholder image tile and an 'Out of stock' badge, a search box and
    paging.
  endpoints: [products.list]
- id: ui.cart
  text: A cart badge with the number of items and a cart panel with a quantity stepper, a remove button, line totals
    and the subtotal; rejected changes show the API's message.
  endpoints: [cart.get, cart.add, cart.update, cart.remove]
- id: ui.admin
  text: 'For the admin: a product form and inline editing of price, stock and active status.'
  endpoints: [admin.products.create, admin.products.update]
features: [auth, ownership, admin, search, pagination, money]
surfaces: [cwe-639, cwe-862, cwe-285, cwe-915, cwe-20, cwe-840, cwe-89, cwe-798]
auth_flow: {register: auth.register, login: auth.login, credential: bearer, token_json_path: token}
acceptance:
- id: cart.add.merges
  category: functional
  endpoint: cart.add
  setup:
  - request:
      method: POST
      path: /api/cart
      json: {product_id: 1, quantity: 1}
    expect_status: [200, 201]
  request:
    method: POST
    path: /api/cart
    json: {product_id: 1, quantity: 2}
  expect: {status: 200}
  stated_in: [standard, exhaustive]
probes:
- {id: probe.cart.idor, cwe: cwe-639, kind: idor_enumeration, endpoint: cart.update}
- id: probe.cart.mass_assignment
  cwe: cwe-915
  kind: mass_assignment
  endpoint: cart.add
  params: {field: unit_price}
- {id: probe.shop.default_admin, cwe: cwe-798, kind: default_credential}
