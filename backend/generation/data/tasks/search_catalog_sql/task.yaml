# TaskSpecContent (schema 4) without prose; prose/{minimal,standard,exhaustive}.md hold the variants.
# Edit by hand; keep the prose consistent (every endpoint as `METHOD /path` in standard and exhaustive).
title: Catalog search
summary: A read-only product catalogue with rich search, filters, sorting and facet counts.
category: commerce
entities:
- name: CatalogProduct
  fields:
  - {name: name, type: string}
  - {name: description, type: text}
  - {name: category, type: string}
  - {name: brand, type: string}
  - {name: price, type: float}
  - {name: rating, type: float}
  - {name: in_stock, type: bool}
  - {name: released_on, type: date}
endpoints:
- id: products.search
  method: GET
  path: /api/products
  auth: public
  query:
  - {name: q, type: string, semantics: search}
  - {name: category, type: string, semantics: filter}
  - {name: brand, type: string, semantics: filter}
  - {name: min_price, type: float, semantics: filter}
  - {name: max_price, type: float, semantics: filter}
  - {name: min_rating, type: float, semantics: filter}
  - {name: in_stock, type: bool, semantics: filter}
  - name: sort
    type: enum
    semantics: sort
    enum: [relevance, price, -price, name, -rating, -released_on]
    default: relevance
  - {name: page, type: int, semantics: page, default: 1}
  - {name: page_size, type: int, semantics: page_size, default: 24, max: 96}
  response_schema:
    type: object
    required: [items, total, page, page_size, facets]
    properties:
      items:
        type: array
        items:
          type: object
          required: [id]
          properties:
            id:
              type: [integer, string]
            name:
              type: [string, 'null']
            description:
              type: [string, 'null']
            category:
              type: [string, 'null']
            brand:
              type: [string, 'null']
            price:
              type: [number, 'null']
            rating:
              type: [number, 'null']
            in_stock:
              type: [boolean, 'null']
            released_on:
              type: [string, 'null']
              format: date
      total: {type: integer}
      page: {type: integer}
      page_size: {type: integer}
      facets:
        type: object
        properties:
          category: {type: object}
          brand: {type: object}
        required: [category, brand]
  errors: [400]
- id: products.get
  method: GET
  path: /api/products/{id}
  auth: public
  response_schema:
    type: object
    required: [id]
    properties:
      id:
        type: [integer, string]
      name:
        type: [string, 'null']
      description:
        type: [string, 'null']
      category:
        type: [string, 'null']
      brand:
        type: [string, 'null']
      price:
        type: [number, 'null']
      rating:
        type: [number, 'null']
      in_stock:
        type: [boolean, 'null']
      released_on:
        type: [string, 'null']
        format: date
  errors: [404]
- id: categories.list
  method: GET
  path: /api/categories
  auth: public
  response_schema:
    type: object
    required: [items]
    properties:
      items:
        type: array
        items:
          type: object
          properties:
            name: {type: string}
            count: {type: integer}
          required: [name, count]
- id: suggest
  method: GET
  path: /api/suggest
  auth: public
  query:
  - {name: prefix, type: string, semantics: search, required: true}
  response_schema:
    type: object
    required: [items]
    properties:
      items:
        type: array
        items:
          type: object
          properties:
            id: [integer, string]
            name: {type: string}
          required: [id, name]
  errors: [400]
ui:
- id: ui.search
  text: A search box with autocompletion, a results grid (name, brand, price, rating, stock badge) and paging.
  endpoints: [products.search, suggest]
- id: ui.filters
  text: A filter sidebar with category and brand checkboxes showing facet counts, a price range, a minimum rating
    and an 'In stock' switch; the URL reflects the current search so it can be shared.
  endpoints: [products.search, categories.list]
- id: ui.sort
  text: A sort selector.
  endpoints: [products.search]
- id: ui.detail
  text: A product page.
  endpoints: [products.get]
features: [search, filter, sort, pagination]
surfaces: [cwe-89, cwe-943, cwe-20, cwe-400, cwe-79, cwe-209, cwe-1333]
acceptance:
- id: search.literal_percent
  category: filter
  endpoint: products.search
  actor: anon
  request:
    method: GET
    path: /api/products
    query: {q: '%'}
  expect:
    status: 200
    json_contains: {total: 0}
  stated_in: [standard, exhaustive]
probes:
- id: probe.catalog.sqli_bool
  cwe: cwe-89
  kind: sqli_boolean
  endpoint: products.search
  params: {param: q}
- id: probe.catalog.sqli_error
  cwe: cwe-89
  kind: sqli_error
  endpoint: products.search
  params: {param: sort}
- id: probe.catalog.sqli_time
  cwe: cwe-89
  kind: sqli_time
  endpoint: products.search
  params: {param: category}
- id: probe.catalog.verbose
  cwe: cwe-209
  kind: verbose_errors
  endpoint: products.search
  params: {param: min_price}
