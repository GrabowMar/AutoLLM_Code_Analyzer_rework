# TaskSpecContent (schema 4) without prose; prose/{minimal,standard,exhaustive}.md hold the variants.
# Edit by hand; keep the prose consistent (every endpoint as `METHOD /path` in standard and exhaustive).
title: Timesheet with CSV export
summary: Log working hours per project and export them as CSV reports for spreadsheets.
category: reporting
entities:
- name: User
  fields:
  - {name: username, type: string, required: true, unique: true, max_length: 50}
  - {name: password, type: string, required: true, secret: true}
- name: TimeEntry
  fields:
  - {name: project, type: string, required: true, max_length: 100}
  - {name: description, type: string, required: true, max_length: 500}
  - {name: hours, type: float, required: true, min: 0.25, max: 24}
  - {name: date, type: date, required: true}
  - {name: created_at, type: datetime}
  owned_by_user: true
endpoints:
- id: auth.register
  method: POST
  path: /api/auth/register
  auth: public
  success_status: 201
  request_schema:
    type: object
    required: [username, password]
    properties:
      username: {type: string, minLength: 1, maxLength: 50}
      password: {type: string, minLength: 1}
  errors: [400, 409]
- id: auth.login
  method: POST
  path: /api/auth/login
  auth: public
  request_schema:
    type: object
    properties:
      username: {type: string}
      password: {type: string}
    required: [username, password]
  errors: [401]
- id: entries.list
  method: GET
  path: /api/entries
  auth: user
  query:
  - {name: start_date, type: date, semantics: filter}
  - {name: end_date, type: date, semantics: filter}
  - {name: project, type: string, semantics: filter}
  - {name: page, type: int, semantics: page, default: 1}
  - {name: page_size, type: int, semantics: page_size, default: 50, max: 200}
  response_schema:
    type: object
    required: [items, total, page, page_size]
    properties:
      items:
        type: array
        items:
          type: object
          required: [id, project, description, hours, date]
          properties:
            id:
              type: [integer, string]
            project: {type: string, maxLength: 100, minLength: 1}
            description: {type: string, maxLength: 500, minLength: 1}
            hours: {type: number, minimum: 0.25, maximum: 24}
            date: {type: string, format: date}
            created_at:
              type: [string, 'null']
              format: date-time
      total: {type: integer}
      page: {type: integer}
      page_size: {type: integer}
- id: entries.create
  method: POST
  path: /api/entries
  auth: user
  success_status: 201
  request_schema:
    type: object
    properties:
      project: {type: string, maxLength: 100, minLength: 1}
      description: {type: string, maxLength: 500, minLength: 1}
      hours: {type: number, minimum: 0.25, maximum: 24}
      date: {type: string, format: date}
    required: [project, description, hours, date]
  response_schema:
    type: object
    required: [id, project, description, hours, date]
    properties:
      id:
        type: [integer, string]
      project: {type: string, maxLength: 100, minLength: 1}
      description: {type: string, maxLength: 500, minLength: 1}
      hours: {type: number, minimum: 0.25, maximum: 24}
      date: {type: string, format: date}
      created_at:
        type: [string, 'null']
        format: date-time
  errors: [400]
- id: entries.update
  method: PATCH
  path: /api/entries/{id}
  auth: owner
  owner_entity: TimeEntry
  request_schema:
    type: object
    properties:
      project: {type: string, maxLength: 100, minLength: 1}
      description: {type: string, maxLength: 500, minLength: 1}
      hours: {type: number, minimum: 0.25, maximum: 24}
      date: {type: string, format: date}
  response_schema:
    type: object
    required: [id, project, description, hours, date]
    properties:
      id:
        type: [integer, string]
      project: {type: string, maxLength: 100, minLength: 1}
      description: {type: string, maxLength: 500, minLength: 1}
      hours: {type: number, minimum: 0.25, maximum: 24}
      date: {type: string, format: date}
      created_at:
        type: [string, 'null']
        format: date-time
  errors: [400, 404]
- id: entries.delete
  method: DELETE
  path: /api/entries/{id}
  auth: owner
  owner_entity: TimeEntry
  success_status: 204
  errors: [404]
- id: export.entries
  method: GET
  path: /api/exports/entries.csv
  auth: user
  query:
  - {name: start_date, type: date, semantics: filter}
  - {name: end_date, type: date, semantics: filter}
  - {name: project, type: string, semantics: filter}
  content_type: none
  tags: [export]
- id: export.summary
  method: GET
  path: /api/exports/summary.csv
  auth: user
  query:
  - {name: start_date, type: date, semantics: filter}
  - {name: end_date, type: date, semantics: filter}
  content_type: none
  tags: [export]
ui:
- id: ui.auth
  text: Registration and sign-in forms; the signed-in username and a sign-out button.
  endpoints: [auth.register, auth.login]
- id: ui.log
  text: A quick entry form (project with suggestions from earlier entries, description, hours, date defaulting to
    today) showing the API's validation messages.
  endpoints: [entries.create]
- id: ui.list
  text: The entry list with period and project filters, inline editing, delete with confirmation, per-project totals
    and paging.
  endpoints: [entries.list, entries.update, entries.delete]
- id: ui.export
  text: '''Export CSV'' and ''Export totals'' buttons that download the files for the current filters.'
  endpoints: [export.entries, export.summary]
features: [auth, ownership, csv-export, filter, pagination]
surfaces: [cwe-1236, cwe-639, cwe-862, cwe-20, cwe-116, cwe-113, cwe-89]
auth_flow: {register: auth.register, login: auth.login, credential: bearer, token_json_path: token}
acceptance:
- id: export.header
  category: functional
  endpoint: export.entries
  setup:
  - request:
      method: POST
      path: /api/entries
      json: {project: zz, description: 'a, "quoted" note', hours: 1.5, date: '2026-02-03'}
    expect_status: 201
  request:
    method: GET
    path: /api/exports/entries.csv
    query: {project: zz}
  expect:
    status: 200
    header_contains: {Content-Type: text/csv}
  stated_in: [standard, exhaustive]
probes:
- {id: probe.entries.idor, cwe: cwe-639, kind: idor_enumeration, endpoint: entries.update}
