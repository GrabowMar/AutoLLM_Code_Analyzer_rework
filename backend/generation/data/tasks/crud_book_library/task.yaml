# TaskSpecContent (schema 4) without prose; prose/{minimal,standard,exhaustive}.md hold the variants.
# Edit by hand; keep the prose consistent (every endpoint as `METHOD /path` in standard and exhaustive).
title: Book library
summary: Catalogue a shared book collection and collect reader reviews.
category: crud
entities:
- name: User
  fields:
  - {name: username, type: string, required: true, unique: true, max_length: 50}
  - {name: password, type: string, required: true, secret: true}
- name: Book
  fields:
  - {name: title, type: string, required: true, max_length: 255}
  - {name: author, type: string, required: true, max_length: 255}
  - {name: year, type: int, min: 1000}
  - {name: isbn, type: string, max_length: 20}
  - {name: created_at, type: datetime}
- name: Review
  fields:
  - {name: book_id, type: ref, ref: Book}
  - {name: rating, type: int, required: true, min: 1, max: 5}
  - {name: comment, type: string, max_length: 1000}
  - {name: created_at, type: datetime}
  owned_by_user: true
endpoints:
- id: auth.register
  method: POST
  path: /api/auth/register
  auth: public
  success_status: 201
  request_schema:
    type: object
    required: [username, password]
    properties:
      username: {type: string, minLength: 1, maxLength: 50}
      password: {type: string, minLength: 1}
  errors: [400, 409]
- id: auth.login
  method: POST
  path: /api/auth/login
  auth: public
  request_schema:
    type: object
    properties:
      username: {type: string}
      password: {type: string}
    required: [username, password]
  errors: [401]
- id: books.list
  method: GET
  path: /api/books
  auth: public
  query:
  - {name: q, type: string, semantics: search}
  - {name: page, type: int, semantics: page, default: 1}
  - {name: page_size, type: int, semantics: page_size, default: 20, max: 100}
  response_schema:
    type: object
    required: [items, total, page, page_size]
    properties:
      items:
        type: array
        items:
          type: object
          required: [id, title, author, review_count, average_rating]
          properties:
            id:
              type: [integer, string]
            title: {type: string, maxLength: 255, minLength: 1}
            author: {type: string, maxLength: 255, minLength: 1}
            year:
              type: [integer, 'null']
              minimum: 1000
            isbn:
              type: [string, 'null']
              maxLength: 20
            created_at:
              type: [string, 'null']
              format: date-time
            review_count: {type: integer}
            average_rating: &id001 [number, 'null']
      total: {type: integer}
      page: {type: integer}
      page_size: {type: integer}
- id: books.create
  method: POST
  path: /api/books
  auth: user
  success_status: 201
  request_schema:
    type: object
    properties:
      title: {type: string, maxLength: 255, minLength: 1}
      author: {type: string, maxLength: 255, minLength: 1}
      year:
        type: [integer, 'null']
        minimum: 1000
      isbn:
        type: [string, 'null']
        maxLength: 20
    required: [title, author]
  response_schema:
    type: object
    required: [id, title, author, review_count, average_rating]
    properties:
      id:
        type: [integer, string]
      title: {type: string, maxLength: 255, minLength: 1}
      author: {type: string, maxLength: 255, minLength: 1}
      year:
        type: [integer, 'null']
        minimum: 1000
      isbn:
        type: [string, 'null']
        maxLength: 20
      created_at:
        type: [string, 'null']
        format: date-time
      review_count: {type: integer}
      average_rating: *id001
  errors: [400]
- id: books.get
  method: GET
  path: /api/books/{id}
  auth: public
  response_schema:
    type: object
    required: [id, title, author, review_count, average_rating]
    properties:
      id:
        type: [integer, string]
      title: {type: string, maxLength: 255, minLength: 1}
      author: {type: string, maxLength: 255, minLength: 1}
      year:
        type: [integer, 'null']
        minimum: 1000
      isbn:
        type: [string, 'null']
        maxLength: 20
      created_at:
        type: [string, 'null']
        format: date-time
      review_count: {type: integer}
      average_rating: *id001
  errors: [404]
- id: books.replace
  method: PUT
  path: /api/books/{id}
  auth: user
  request_schema:
    type: object
    properties:
      title: {type: string, maxLength: 255, minLength: 1}
      author: {type: string, maxLength: 255, minLength: 1}
      year:
        type: [integer, 'null']
        minimum: 1000
      isbn:
        type: [string, 'null']
        maxLength: 20
    required: [title, author]
  response_schema:
    type: object
    required: [id, title, author, review_count, average_rating]
    properties:
      id:
        type: [integer, string]
      title: {type: string, maxLength: 255, minLength: 1}
      author: {type: string, maxLength: 255, minLength: 1}
      year:
        type: [integer, 'null']
        minimum: 1000
      isbn:
        type: [string, 'null']
        maxLength: 20
      created_at:
        type: [string, 'null']
        format: date-time
      review_count: {type: integer}
      average_rating: *id001
  errors: [400, 404]
- id: books.delete
  method: DELETE
  path: /api/books/{id}
  auth: user
  success_status: 204
  errors: [404]
- id: reviews.list
  method: GET
  path: /api/books/{id}/reviews
  auth: public
  response_schema:
    type: object
    required: [items]
    properties:
      items:
        type: array
        items:
          type: object
          required: [id, rating, username]
          properties:
            id:
              type: [integer, string]
            book_id:
              type: [integer, 'null']
            rating: {type: integer, minimum: 1, maximum: 5}
            comment:
              type: [string, 'null']
              maxLength: 1000
            created_at:
              type: [string, 'null']
              format: date-time
            username: {type: string}
  errors: [404]
- id: reviews.create
  method: POST
  path: /api/books/{id}/reviews
  auth: user
  success_status: 201
  request_schema:
    type: object
    properties:
      rating: {type: integer, minimum: 1, maximum: 5}
      comment:
        type: [string, 'null']
        maxLength: 1000
    required: [rating]
  response_schema:
    type: object
    required: [id, rating, username]
    properties:
      id:
        type: [integer, string]
      book_id:
        type: [integer, 'null']
      rating: {type: integer, minimum: 1, maximum: 5}
      comment:
        type: [string, 'null']
        maxLength: 1000
      created_at:
        type: [string, 'null']
        format: date-time
      username: {type: string}
  errors: [400, 404, 409]
ui:
- id: ui.auth
  text: Registration and sign-in forms; the signed-in username and a sign-out button.
  endpoints: [auth.register, auth.login]
- id: ui.list
  text: A book table with title, author, year and average rating, a search box and paging.
  endpoints: [books.list]
- id: ui.detail
  text: A book page with its reviews (username, rating, comment, date) and, for signed-in users, a rating form.
  endpoints: [books.get, reviews.list, reviews.create]
- id: ui.forms
  text: Add and edit forms that show the API's validation messages; delete asks for confirmation.
  endpoints: [books.create, books.replace, books.delete]
features: [auth, search, pagination]
surfaces: [cwe-89, cwe-79, cwe-862, cwe-20, cwe-639]
auth_flow: {register: auth.register, login: auth.login, credential: bearer, token_json_path: token}
acceptance:
- id: books.average_rating
  category: functional
  endpoint: books.get
  setup:
  - request:
      method: POST
      path: /api/books
      json: {title: Dune, author: Frank Herbert}
    expect_status: 201
    capture: {bid: $.id}
  - request:
      method: POST
      path: /api/books/{bid}/reviews
      json: {rating: 4}
    expect_status: 201
  - request:
      method: POST
      path: /api/books/{bid}/reviews
      json: {rating: 5}
    actor: user_b
    expect_status: 201
  request: {method: GET, path: '/api/books/{bid}'}
  expect:
    status: 200
    json_contains: {review_count: 2, average_rating: 4.5}
  stated_in: [standard, exhaustive]
probes:
- id: probe.books.sqli
  cwe: cwe-89
  kind: sqli_boolean
  endpoint: books.list
  params: {param: q}
- id: probe.reviews.xss
  cwe: cwe-79
  kind: xss_stored
  endpoint: reviews.create
  params: {field: comment, view_endpoint: reviews.list}
