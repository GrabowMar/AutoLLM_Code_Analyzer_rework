# TaskSpecContent (schema 4) without prose; prose/{minimal,standard,exhaustive}.md hold the variants.
# Edit by hand; keep the prose consistent (every endpoint as `METHOD /path` in standard and exhaustive).
title: Game leaderboard
summary: Submit game scores and rank players by their best score, all-time or for recent periods.
category: gaming
entities:
- name: User
  fields:
  - {name: username, type: string, required: true, unique: true, max_length: 50}
  - {name: password, type: string, required: true, secret: true}
- name: Score
  fields:
  - {name: score, type: int, required: true, min: 0, max: 1000000000}
  - {name: achieved_at, type: datetime}
  - {name: is_hidden, type: bool, default: false}
  owned_by_user: true
endpoints:
- id: auth.register
  method: POST
  path: /api/auth/register
  auth: public
  success_status: 201
  request_schema:
    type: object
    required: [username, password]
    properties:
      username: {type: string, minLength: 1, maxLength: 50}
      password: {type: string, minLength: 1}
  errors: [400, 409]
- id: auth.login
  method: POST
  path: /api/auth/login
  auth: public
  request_schema:
    type: object
    properties:
      username: {type: string}
      password: {type: string}
    required: [username, password]
  errors: [401]
- id: leaderboard.get
  method: GET
  path: /api/leaderboard
  auth: public
  query:
  - name: period
    type: enum
    semantics: filter
    enum: [all, week, today]
    default: all
  - {name: limit, type: int, semantics: page_size, default: 10, max: 100}
  - {name: player, type: string, semantics: filter}
  response_schema:
    type: object
    required: [items, total]
    properties:
      items:
        type: array
        items:
          type: object
          properties:
            rank: {type: integer}
            player: {type: string}
            score: {type: integer}
            achieved_at: {type: string}
          required: [rank, player, score]
      total: {type: integer}
  errors: [400]
- id: scores.submit
  method: POST
  path: /api/scores
  auth: user
  success_status: 201
  request_schema:
    type: object
    properties:
      score: {type: integer, minimum: 0, maximum: 1000000000}
    required: [score]
  response_schema:
    type: object
    required: [id, score, player, rank, personal_best]
    properties:
      id:
        type: [integer, string]
      score: {type: integer, minimum: 0, maximum: 1000000000}
      achieved_at:
        type: [string, 'null']
        format: date-time
      is_hidden:
        type: [boolean, 'null']
      player: {type: string}
      rank: {type: integer}
      personal_best: {type: boolean}
  errors: [400]
- id: scores.mine
  method: GET
  path: /api/scores
  auth: user
  response_schema:
    type: object
    required: [items, best_score]
    properties:
      items:
        type: array
        items:
          type: object
          required: [id, score, player]
          properties:
            id:
              type: [integer, string]
            score: {type: integer, minimum: 0, maximum: 1000000000}
            achieved_at:
              type: [string, 'null']
              format: date-time
            is_hidden:
              type: [boolean, 'null']
            player: {type: string}
      best_score: [integer, 'null']
- id: admin.scores
  method: GET
  path: /api/admin/scores
  auth: admin
  query:
  - {name: page, type: int, semantics: page, default: 1}
  - {name: page_size, type: int, semantics: page_size, default: 20, max: 100}
  response_schema:
    type: object
    required: [items, total, page, page_size]
    properties:
      items:
        type: array
        items:
          type: object
          required: [id, score, player]
          properties:
            id:
              type: [integer, string]
            score: {type: integer, minimum: 0, maximum: 1000000000}
            achieved_at:
              type: [string, 'null']
              format: date-time
            is_hidden:
              type: [boolean, 'null']
            player: {type: string}
      total: {type: integer}
      page: {type: integer}
      page_size: {type: integer}
- id: admin.scores.hide
  method: POST
  path: /api/admin/scores/{id}/toggle
  auth: admin
  response_schema:
    type: object
    required: [id, score, player]
    properties:
      id:
        type: [integer, string]
      score: {type: integer, minimum: 0, maximum: 1000000000}
      achieved_at:
        type: [string, 'null']
        format: date-time
      is_hidden:
        type: [boolean, 'null']
      player: {type: string}
  errors: [404]
ui:
- id: ui.auth
  text: Registration and sign-in forms; the signed-in username and a sign-out button.
  endpoints: [auth.register, auth.login]
- id: ui.board
  text: A leaderboard table (rank, player, score, date) with the top three marked and the signed-in player's row
    highlighted, period tabs, a player search and a refresh button.
  endpoints: [leaderboard.get]
- id: ui.submit
  text: A score form that shows the new rank and a 'New personal best!' message.
  endpoints: [scores.submit]
- id: ui.mine
  text: The player's recent submissions and best score.
  endpoints: [scores.mine]
- id: ui.admin
  text: 'For the admin: every score with a hide/show button.'
  endpoints: [admin.scores, admin.scores.hide]
features: [auth, ownership, admin, sort, filter]
surfaces: [cwe-862, cwe-285, cwe-20, cwe-915, cwe-89, cwe-79, cwe-798]
auth_flow: {register: auth.register, login: auth.login, credential: bearer, token_json_path: token}
probes:
- id: probe.scores.mass_assignment
  cwe: cwe-915
  kind: mass_assignment
  endpoint: scores.submit
  params: {field: achieved_at}
- id: probe.leaderboard.sqli
  cwe: cwe-89
  kind: sqli_boolean
  endpoint: leaderboard.get
  params: {param: player}
- {id: probe.leaderboard.default_admin, cwe: cwe-798, kind: default_credential}
