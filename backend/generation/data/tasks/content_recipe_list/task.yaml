# TaskSpecContent (schema 4) without prose; prose/{minimal,standard,exhaustive}.md hold the variants.
# Edit by hand; keep the prose consistent (every endpoint as `METHOD /path` in standard and exhaustive).
title: Recipe book
summary: Share recipes with ingredients and instructions, browsable by category.
category: content
entities:
- name: User
  fields:
  - {name: username, type: string, required: true, unique: true, max_length: 50}
  - {name: password, type: string, required: true, secret: true}
- name: Recipe
  fields:
  - {name: title, type: string, required: true, max_length: 255}
  - {name: ingredients, type: json, required: true, max_length: 200}
  - {name: instructions, type: text, required: true, max_length: 10000}
  - name: category
    type: enum
    enum: [breakfast, main, dessert, snack, drink, other]
    default: other
  - {name: prep_minutes, type: int, min: 1, max: 1440}
  - {name: servings, type: int, min: 1, max: 100}
  - {name: created_at, type: datetime}
  owned_by_user: true
endpoints:
- id: auth.register
  method: POST
  path: /api/auth/register
  auth: public
  success_status: 201
  request_schema:
    type: object
    required: [username, password]
    properties:
      username: {type: string, minLength: 1, maxLength: 50}
      password: {type: string, minLength: 1}
  errors: [400, 409]
- id: auth.login
  method: POST
  path: /api/auth/login
  auth: public
  request_schema:
    type: object
    properties:
      username: {type: string}
      password: {type: string}
    required: [username, password]
  errors: [401]
- id: recipes.create
  method: POST
  path: /api/recipes
  auth: user
  success_status: 201
  request_schema:
    type: object
    properties:
      title: {type: string, maxLength: 255, minLength: 1}
      ingredients:
        type: array
        items: {type: string, maxLength: 200, minLength: 1}
        minItems: 1
        maxItems: 50
      instructions: {type: string, maxLength: 10000, minLength: 1}
      category:
        type: [string, 'null']
        enum: [breakfast, main, dessert, snack, drink, other, null]
      prep_minutes:
        type: [integer, 'null']
        minimum: 1
        maximum: 1440
      servings:
        type: [integer, 'null']
        minimum: 1
        maximum: 100
    required: [title, ingredients, instructions]
  response_schema:
    type: object
    required: [id, title, ingredients, instructions, author]
    properties:
      id:
        type: [integer, string]
      title: {type: string, maxLength: 255, minLength: 1}
      ingredients:
        type: array
        items: {type: string, maxLength: 200, minLength: 1}
        minItems: 1
        maxItems: 50
      instructions: {type: string, maxLength: 10000, minLength: 1}
      category:
        type: [string, 'null']
        enum: [breakfast, main, dessert, snack, drink, other, null]
      prep_minutes:
        type: [integer, 'null']
        minimum: 1
        maximum: 1440
      servings:
        type: [integer, 'null']
        minimum: 1
        maximum: 100
      created_at:
        type: [string, 'null']
        format: date-time
      author: {type: string}
  errors: [400]
- id: recipes.list
  method: GET
  path: /api/recipes
  auth: public
  query:
  - name: category
    type: enum
    semantics: filter
    enum: [breakfast, main, dessert, snack, drink, other]
  - {name: q, type: string, semantics: search}
  - {name: page, type: int, semantics: page, default: 1}
  - {name: page_size, type: int, semantics: page_size, default: 20, max: 100}
  response_schema:
    type: object
    required: [items, total, page, page_size]
    properties:
      items:
        type: array
        items:
          type: object
          properties:
            id: [integer, string]
            title: {type: string}
            category: {type: string}
            prep_minutes: [integer, 'null']
            author: {type: string}
          required: [id, title, category, author]
      total: {type: integer}
      page: {type: integer}
      page_size: {type: integer}
- id: recipes.get
  method: GET
  path: /api/recipes/{id}
  auth: public
  response_schema:
    type: object
    required: [id, title, ingredients, instructions, author]
    properties:
      id:
        type: [integer, string]
      title: {type: string, maxLength: 255, minLength: 1}
      ingredients:
        type: array
        items: {type: string, maxLength: 200, minLength: 1}
        minItems: 1
        maxItems: 50
      instructions: {type: string, maxLength: 10000, minLength: 1}
      category:
        type: [string, 'null']
        enum: [breakfast, main, dessert, snack, drink, other, null]
      prep_minutes:
        type: [integer, 'null']
        minimum: 1
        maximum: 1440
      servings:
        type: [integer, 'null']
        minimum: 1
        maximum: 100
      created_at:
        type: [string, 'null']
        format: date-time
      author: {type: string}
  errors: [404]
- id: recipes.replace
  method: PUT
  path: /api/recipes/{id}
  auth: owner
  owner_entity: Recipe
  request_schema:
    type: object
    properties:
      title: {type: string, maxLength: 255, minLength: 1}
      ingredients:
        type: array
        items: {type: string, maxLength: 200, minLength: 1}
        minItems: 1
        maxItems: 50
      instructions: {type: string, maxLength: 10000, minLength: 1}
      category:
        type: [string, 'null']
        enum: [breakfast, main, dessert, snack, drink, other, null]
      prep_minutes:
        type: [integer, 'null']
        minimum: 1
        maximum: 1440
      servings:
        type: [integer, 'null']
        minimum: 1
        maximum: 100
    required: [title, ingredients, instructions]
  response_schema:
    type: object
    required: [id, title, ingredients, instructions, author]
    properties:
      id:
        type: [integer, string]
      title: {type: string, maxLength: 255, minLength: 1}
      ingredients:
        type: array
        items: {type: string, maxLength: 200, minLength: 1}
        minItems: 1
        maxItems: 50
      instructions: {type: string, maxLength: 10000, minLength: 1}
      category:
        type: [string, 'null']
        enum: [breakfast, main, dessert, snack, drink, other, null]
      prep_minutes:
        type: [integer, 'null']
        minimum: 1
        maximum: 1440
      servings:
        type: [integer, 'null']
        minimum: 1
        maximum: 100
      created_at:
        type: [string, 'null']
        format: date-time
      author: {type: string}
  errors: [400, 403, 404]
- id: recipes.delete
  method: DELETE
  path: /api/recipes/{id}
  auth: owner
  owner_entity: Recipe
  success_status: 204
  errors: [403, 404]
ui:
- id: ui.auth
  text: Registration and sign-in forms; the signed-in username and a sign-out button.
  endpoints: [auth.register, auth.login]
- id: ui.list
  text: Recipe cards with title, category, prep time and author, a category dropdown, a title search and paging.
  endpoints: [recipes.list]
- id: ui.detail
  text: A recipe page with the ingredients as a list and the instructions with their line breaks kept.
  endpoints: [recipes.get]
- id: ui.edit
  text: Add and edit forms with ingredient rows that can be added and removed, showing the API's validation messages;
    delete asks for confirmation.
  endpoints: [recipes.create, recipes.replace, recipes.delete]
features: [auth, ownership, search, filter, pagination]
surfaces: [cwe-79, cwe-89, cwe-639, cwe-862, cwe-20, cwe-915]
auth_flow: {register: auth.register, login: auth.login, credential: bearer, token_json_path: token}
probes:
- id: probe.recipes.xss
  cwe: cwe-79
  kind: xss_stored
  endpoint: recipes.create
  params: {field: instructions, view_endpoint: recipes.get}
- id: probe.recipes.sqli
  cwe: cwe-89
  kind: sqli_boolean
  endpoint: recipes.list
  params: {param: q}
