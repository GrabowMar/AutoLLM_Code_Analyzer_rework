# The parent sample: a usable app_agentic run of crud_todo_list@1 on flask-react@1, grown from the
# flask-react-minimal@1 starter. Its tree is parent_app/. It deliberately has two defects slot tests can find:
# the search in backend/todos.py builds SQL with an f-string (cwe-89, detector py-sql-fstring) and
# update_todo does not check the owner (cwe-639).
task: crud_todo_list@1
prose_variant: standard
stack_profile: flask-react@1
starter: flask-react-minimal@1
model: deepseek/deepseek-v4.1-flash
harness: opencode
endpoints:
  todos.list: {method: GET, path: /api/todos, handler: backend/todos.py::list_todos}
  todos.create: {method: POST, path: /api/todos, handler: backend/todos.py::create_todo}
  todos.update: {method: PATCH, path: "/api/todos/{id}", handler: backend/todos.py::update_todo}
  todos.delete: {method: DELETE, path: "/api/todos/{id}", handler: backend/todos.py::delete_todo}
  auth.register: {method: POST, path: /api/auth/register, handler: backend/auth.py::register}
  auth.login: {method: POST, path: /api/auth/login, handler: backend/auth.py::login}
components:
  App: frontend/src/App.jsx
  TodoForm: frontend/src/components/TodoForm.jsx
  TodoList: frontend/src/components/TodoList.jsx
