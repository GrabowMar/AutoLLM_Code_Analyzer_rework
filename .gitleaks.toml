[extend]
useDefault = true

[allowlist]
description = "Project-wide allowlist for documented false positives."

paths = [
  # `*.example` env templates are intentionally committed placeholders.
  '''(^|/)\.envs/.*\.example$''',
  # Analyzer self-test fixtures and captured tool outputs contain synthetic,
  # deliberately planted secrets (the canary must detect them).
  '''^backend/analysis/data/canary/''',
  '''^backend/analysis/tests/fixtures/tool_outputs/''',
  '''^backend/analysis/tests/support/capture_tool_outputs\.py$''',
]

[[rules]]
id = "curl-auth-header"

  [rules.allowlist]
  description = "TokenSection.svelte renders a curl example with the literal placeholder `YOUR_TOKEN` for users."
  paths = [
    '''frontend/src/lib/components/users-settings/TokenSection\.svelte''',
  ]
